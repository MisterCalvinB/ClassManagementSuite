function fmJoinPath(prefix, leaf) {
  var p = normPath(prefix || '').replace(/^\/+|\/+$/g, '');
  var l = normPath(leaf || '').replace(/^\/+|\/+$/g, '');
  if (!p) return l;
  if (!l) return p;
  return p + '/' + l;
}

function fmResolveDocEditorVirtualPath(virtualPath) {
  var rel = normPath(virtualPath || '').replace(/^\/+|\/+$/g, '');
  if (!rel) return null;
  var parts = rel.split('/');
  var head = parts.shift();
  var target = null;
  if (head === 'Documents') target = 'docEditorDocs';
  else if (head === 'CSS') target = 'docEditorStylesheets';
  else if (head === 'Templates') target = 'docEditorTemplates';
  if (!target) return null;
  return { target: target, path: parts.join('/') };
}

function fmResolveDestination(target, relPath) {
  if (target !== 'docEditor') {
    return { target: target, path: normPath(relPath || '').replace(/^\/+|\/+$/g, '') };
  }
  return fmResolveDocEditorVirtualPath(relPath);
}

function fmGetCurrentBrowseSelection() {
  return Array.from(fmSelection.values()).filter(function(item) {
    return item && item.scope === 'browse';
  });
}

function fmClearSelection() {
  fmSelection.clear();
  fmLastAnchorKey = '';
  fmUpdateSelectionUI();
}

function fmSetSingleSelection(item) {
  fmSelection.clear();
  fmSelection.set(item.key, item);
  fmLastAnchorKey = item.key;
  fmUpdateSelectionUI();
}

function fmHandleBrowseSelection(item, evt) {
  var ctrlLike = !!(evt.ctrlKey || evt.metaKey);
  var shift = !!evt.shiftKey;

  if (shift && fmLastAnchorKey && fmVisibleOrder.indexOf(fmLastAnchorKey) !== -1) {
    var a = fmVisibleOrder.indexOf(fmLastAnchorKey);
    var b = fmVisibleOrder.indexOf(item.key);
    if (b === -1) {
      fmSetSingleSelection(item);
      return;
    }
    var lo = Math.min(a, b);
    var hi = Math.max(a, b);
    if (!ctrlLike) fmSelection.clear();
    for (var i = lo; i <= hi; i++) {
      var key = fmVisibleOrder[i];
      var row = document.querySelector('[data-fm-key="' + CSS.escape(key) + '"]');
      if (!row) continue;
      fmSelection.set(key, {
        key: key,
        scope: 'browse',
        kind: row.dataset.fmKind,
        target: row.dataset.fmTarget,
        relativePath: normPath(row.dataset.fmRelPath || ''),
        isDirectory: row.dataset.fmKind === 'folder'
      });
    }
    fmUpdateSelectionUI();
    return;
  }

  if (ctrlLike) {
    if (fmSelection.has(item.key)) fmSelection.delete(item.key);
    else fmSelection.set(item.key, item);
    fmLastAnchorKey = item.key;
    fmUpdateSelectionUI();
    return;
  }

  fmSetSingleSelection(item);
}

function fmUpdateSelectionUI() {
  document.querySelectorAll('[data-fm-key]').forEach(function(row) {
    var key = row.dataset.fmKey;
    row.classList.toggle('is-selected', fmSelection.has(key));
  });
}

function fmEnsureSelectionForContext(item) {
  var selected = fmGetCurrentBrowseSelection();
  var alreadySelected = fmSelection.has(item.key);
  if (!alreadySelected || !selected.length) {
    fmSetSingleSelection(item);
    return [item];
  }
  return selected;
}

async function fmEnsureUniqueDestinationName(target, folderPath, baseName) {
  var name = String(baseName || '').trim();
  var dot = name.lastIndexOf('.');
  var hasExt = dot > 0;
  var stem = hasExt ? name.slice(0, dot) : name;
  var ext = hasExt ? name.slice(dot) : '';
  var n = 1;
  while (n < 500) {
    var candidate = n === 1 ? (stem + ' - Copy' + ext) : (stem + ' - Copy (' + n + ')' + ext);
    var rel = fmJoinPath(folderPath, candidate);
    var stat = await Desktop.statByPath(target, rel);
    if (!stat || !stat.exists) return candidate;
    n += 1;
  }
  return stem + ' - Copy ' + Date.now() + ext;
}

function fmPromptConflict(itemLabel, destinationRel) {
  var overlay = document.getElementById('fmConflictOverlay');
  var title = document.getElementById('fmConflictTitle');
  var msg = document.getElementById('fmConflictMsg');
  var name = document.getElementById('fmConflictName');
  var btnRename = document.getElementById('fmConflictRenameBtn');
  var btnReplace = document.getElementById('fmConflictReplaceBtn');
  var btnSkip = document.getElementById('fmConflictSkipBtn');

  title.textContent = tt('fmConflictTitle', 'Conflict Detected');
  msg.textContent = tt('fmConflictMsg', 'An item with the same name already exists at destination.');
  name.textContent = destinationRel + ' \u2190 ' + itemLabel;
  btnRename.textContent = tt('fmConflictRename', 'Rename');
  btnReplace.textContent = tt('fmConflictReplace', 'Replace');
  btnSkip.textContent = tt('fmConflictSkipOne', 'Skip');

  overlay.style.display = 'flex';

  return new Promise(function(resolve) {
    var done = false;
    function close(action) {
      if (done) return;
      done = true;
      overlay.style.display = 'none';
      btnRename.onclick = null;
      btnReplace.onclick = null;
      btnSkip.onclick = null;
      resolve(action);
    }
    btnRename.onclick = function() { close('rename'); };
    btnReplace.onclick = function() { close('replace'); };
    btnSkip.onclick = function() { close('skip'); };
  });
}

function fmOpenDestinationPicker(opts) {
  opts = opts || {};
  var overlay = document.getElementById('fmPickerOverlay');
  var title = document.getElementById('fmPickerTitle');
  var targetSel = document.getElementById('fmPickerTarget');
  var upBtn = document.getElementById('fmPickerUpBtn');
  var pathEl = document.getElementById('fmPickerPath');
  var listEl = document.getElementById('fmPickerList');
  var chooseBtn = document.getElementById('fmPickerChooseBtn');
  var cancelBtn = document.getElementById('fmPickerCancelBtn');

  targetSel.style.display = 'none';
  var currentTarget = 'user';
  var currentPath = normPath(opts.path || '');

  title.textContent = opts.title || tt('fmMoveTo', 'Move to...');
  chooseBtn.textContent = tt('fmChooseFolder', 'Choose this folder');
  upBtn.textContent = tt('fmFolderUp', 'Up');

  targetSel.innerHTML = '';
  var added = new Set();
  FM_PICKER_TARGETS.forEach(function(ti) {
    if (added.has(ti.value)) return;
    added.add(ti.value);
    var o = document.createElement('option');
    o.value = ti.value;
    o.textContent = tt('fmTargetLabel_' + ti.value, TARGET_LABELS[ti.value] || ti.label);
    targetSel.appendChild(o);
  });
  if (!added.has(currentTarget)) {
    var extra = document.createElement('option');
    extra.value = currentTarget;
    extra.textContent = TARGET_LABELS[currentTarget] || currentTarget;
    targetSel.appendChild(extra);
  }
  targetSel.value = currentTarget;

  async function renderFolders() {
    pathEl.textContent = (TARGET_LABELS[currentTarget] || currentTarget) + '/' + (currentPath || '');
    listEl.innerHTML = '<div class="state-msg" style="padding:16px 10px;">' + escHtml(tt('rfLoading', 'Loading...')) + '</div>';
    try {
      var res = await Desktop.listByPath(currentTarget, currentPath, { recursive: false, includeDirectories: true, extensions: [] });
      var dirs = (res && res.ok && Array.isArray(res.files) ? res.files : []).filter(function(f) {
        return !!f.isDirectory;
      }).sort(function(a, b) { return String(a.filename || '').localeCompare(String(b.filename || '')); });
      listEl.innerHTML = '';
      if (!dirs.length) {
        listEl.innerHTML = '<div class="state-msg" style="padding:16px 10px;">' + escHtml(tt('fmNoSubfolders', 'No subfolders here.')) + '</div>';
        return;
      }
      dirs.forEach(function(d) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'fm-picker-folder';
        b.textContent = '📁 ' + d.filename;
        b.addEventListener('click', function() {
          currentPath = normPath(d.relativePath || fmJoinPath(currentPath, d.filename));
          renderFolders();
        });
        listEl.appendChild(b);
      });
    } catch (e) {
      listEl.innerHTML = '<div class="state-msg" style="padding:16px 10px;">' + escHtml((e && e.message) ? e.message : String(e)) + '</div>';
    }
  }

  overlay.style.display = 'flex';
  renderFolders();

  return new Promise(function(resolve) {
    var done = false;
    function close(val) {
      if (done) return;
      done = true;
      overlay.style.display = 'none';
      chooseBtn.onclick = null;
      cancelBtn.onclick = null;
      upBtn.onclick = null;
      targetSel.onchange = null;
      resolve(val);
    }

    chooseBtn.onclick = function() { close({ target: currentTarget, path: currentPath }); };
    cancelBtn.onclick = function() { close(null); };
    upBtn.onclick = function() {
      if (!currentPath) return;
      currentPath = fmDirName(currentPath);
      renderFolders();
    };
    targetSel.onchange = function() {
      currentTarget = targetSel.value;
      currentPath = '';
      renderFolders();
    };
    overlay.onclick = function(ev) {
      if (ev.target === overlay) close(null);
    };
  });
}

async function fmRunTransfer(items, destinationTarget, destinationFolderPath, mode) {
  if (!window.Desktop || !Desktop.isElectron()) return;
  var hasStatByPath = typeof Desktop.statByPath === 'function';
  var hasCopyByPath = typeof Desktop.copyByPath === 'function';
  var hasMoveByPath = typeof Desktop.moveByPath === 'function';
  var hasRenameByPath = typeof Desktop.renameByPath === 'function';

  if (mode === 'copy' && !hasCopyByPath) {
    showToast(tt('fmTransferApiMissing', 'Transfer API is unavailable. Please restart the app.'), true);
    return;
  }
  if (mode === 'move' && !hasMoveByPath && !hasRenameByPath) {
    showToast(tt('fmTransferApiMissing', 'Transfer API is unavailable. Please restart the app.'), true);
    return;
  }
  if (!Array.isArray(items) || !items.length) return;
  if (fmTransferBusy) {
    showToast(tt('fmBusy', 'Another transfer is already running.'), true);
    return;
  }
  fmTransferBusy = true;

  var copied = 0;
  var moved = 0;
  var skipped = 0;
  var errors = 0;
  var firstErrMsg = '';

  try {
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var srcRel = normPath(item.relativePath || '');
      var srcTarget = item.target;
      var baseName = fmBaseName(srcRel);
      var destName = baseName;
      var replace = false;

      if (!baseName) { skipped++; continue; }
      var destRel = fmJoinPath(destinationFolderPath, destName);

      if (srcTarget === destinationTarget && srcRel === destRel) { skipped++; continue; }
      if (item.kind === 'folder' && srcTarget === destinationTarget) {
        if (destRel === srcRel || destRel.startsWith(srcRel + '/')) {
          skipped++;
          continue;
        }
      }

      var stat = null;
      if (hasStatByPath) {
        stat = await Desktop.statByPath(destinationTarget, destRel);
      }
      if (stat && stat.exists) {
        var decision = await fmPromptConflict(baseName, destRel);
        if (decision === 'skip') {
          skipped++;
          continue;
        }
        if (decision === 'rename') {
          destName = await fmEnsureUniqueDestinationName(destinationTarget, destinationFolderPath, baseName);
          destRel = fmJoinPath(destinationFolderPath, destName);
        } else if (decision === 'replace') {
          replace = true;
        }
      }

      try {
        if (mode === 'move') {
          if (hasMoveByPath) {
            await Desktop.moveByPath(srcTarget, srcRel, destinationTarget, destRel, { replace: replace });
          } else if (hasRenameByPath && srcTarget === destinationTarget && !replace) {
            // Fallback for stale renderer/preload windows: same-target moves can be done as rename.
            await Desktop.renameByPath(srcTarget, srcRel, destRel);
          } else {
            throw new Error(tt('fmTransferApiMissing', 'Transfer API is unavailable. Please restart the app.'));
          }
          moved++;
        } else {
          await Desktop.copyByPath(srcTarget, srcRel, destinationTarget, destRel, { replace: replace });
          copied++;
        }
      } catch (err) {
        errors++;
        if (!firstErrMsg) {
          firstErrMsg = (err && err.message) ? err.message : String(err);
        }
      }
    }
  } finally {
    fmTransferBusy = false;
  }

  if (mode === 'move' && fmClipboard && fmClipboard.mode === 'move') {
    fmClipboard = null;
  }

  if (errors) {
    showToast(tt('fmTransferSummaryErr', 'Transfer done with errors.') + ' ' + moved + '/' + copied + '/' + skipped + '/' + errors + (firstErrMsg ? ' · ' + firstErrMsg : ''), true);
  } else {
    showToast(tt('fmTransferSummary', 'Transfer complete.') + ' ' + moved + '/' + copied + '/' + skipped);
  }

  if (document.getElementById('tab-browse').classList.contains('active')) await loadBrowse({ preservePath: true });
  if (document.getElementById('tab-recent').classList.contains('active')) await loadRecent();
  fmClearSelection();
}

async function fmMoveCopyViaPicker(items, mode) {
  if (!items || !items.length) return;
  var defaultPickerTarget = 'user';
  var defaultPickerPath = browsePath;
  var picker = await fmOpenDestinationPicker({
    title: mode === 'move' ? tt('fmMoveTo', 'Move to...') : tt('fmCopyTo', 'Copy to...'),
    target: defaultPickerTarget,
    path: defaultPickerPath
  });
  if (!picker) return;
  await fmRunTransfer(items, picker.target, picker.path, mode);
}

function startFolderRename(row, folderName, nameEl, prefix) {
  if (row.dataset.renaming === '1') return;
  row.dataset.renaming = '1';
  var oldPath = prefix + folderName;
  var rnBtn = row.querySelector('.btn-rename');
  var origBtnText = rnBtn ? rnBtn.textContent : '';
  if (rnBtn) rnBtn.textContent = tt('fmSave', 'Save');

  var inp = document.createElement('input');
  inp.className = 'rename-input';
  inp.type = 'text';
  inp.value = folderName;
  nameEl.textContent = '';
  nameEl.appendChild(inp);

  var warnEl = document.createElement('span');
  warnEl.className = 'rename-warn';
  nameEl.appendChild(warnEl);

  var done = false;

  function showWarn(msg) { warnEl.textContent = msg || ''; inp.classList.toggle('invalid', !!msg); }

  function cancelFolderRename() {
    if (done) return;
    done = true;
    nameEl.textContent = folderName;
    row.dataset.renaming = '';
    if (rnBtn) { rnBtn.textContent = origBtnText; rnBtn.onclick = null; }
  }

  function confirmFolderRename() {
    if (done) return;
    var newName = inp.value.trim();
    if (!newName) { showWarn(tt('fmRenameEmpty', 'Name cannot be empty.')); return; }
    if (newName === folderName) { cancelFolderRename(); return; }
    if (/[/\\<>:"|?*\x00-\x1f]/.test(newName)) {
      showWarn(tt('fmRenameInvalidChars', 'Name contains invalid characters.')); return;
    }
    done = true;
    var newPath = prefix + newName;
    Desktop.renameByPath(browseTarget, oldPath, newPath).then(async function(res) {
      if (res && res.ok) {
        browseAllFiles.forEach(function(f) {
          var rel = normPath(f.relativePath || f.filename || '');
          if (rel === oldPath || rel.startsWith(oldPath + '/')) {
            f.relativePath = newPath + rel.slice(oldPath.length);
          }
        });
        if (browseTarget === 'mindmaps' && folderName !== newName && typeof Desktop.listByPath === 'function') {
          await Desktop.renameByPath(browseTarget, newPath + '/' + folderName + '.js', newPath + '/' + newName + '.js').catch(function(){});
          var histPath = newPath + '/history';
          try {
            var listed = await Desktop.listByPath(browseTarget, histPath, { extensions: ['.js', '.json'], recursive: false });
            var vFiles = (listed && listed.ok && Array.isArray(listed.files)) ? listed.files : [];
            for (var vi = 0; vi < vFiles.length; vi++) {
              var vfname = (vFiles[vi].relativePath || '').split('/').pop() || vFiles[vi].filename || '';
              if (vfname.startsWith(folderName + '.v')) {
                var suffix = vfname.slice(folderName.length);
                await Desktop.renameByPath(browseTarget, histPath + '/' + vfname, histPath + '/' + newName + suffix).catch(function(){});
              }
            }
          } catch(e) {}
        }
        if (window.Pins && typeof Pins.updatePinPath === 'function') {
          await Pins.updatePinPath(browseTarget, oldPath, newPath, newName);
        }
        row.dataset.renaming = '';
        await loadBrowse({ preservePath: true });
      } else {
        showWarn(tt('fmRenameFailed', 'Rename failed.'));
        done = false;
      }
    }).catch(function(e) {
      showWarn(tt('fmRenameFailed', 'Rename failed: ') + (e && e.message ? e.message : String(e)));
      done = false;
    });
  }

  if (rnBtn) {
    rnBtn.onpointerdown = function(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      confirmFolderRename();
    };
    rnBtn.onclick = function(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      confirmFolderRename();
    };
  }
  inp.addEventListener('input', function() { showWarn(''); });
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') confirmFolderRename();
    if (e.key === 'Escape') cancelFolderRename();
  });
  inp.addEventListener('blur', function() { setTimeout(function() { if (!done) cancelFolderRename(); }, 180); });
  inp.focus();
  inp.select();
}

async function deleteFolderConfirm(folderName, fileCount, prefix, row) {
  var msg = 'Delete folder "' + folderName + '"?\n\nThis will permanently delete all ' +
    fileCount + ' ' + (fileCount === 1 ? 'file' : 'files') + ' inside. This cannot be undone.';
  if (!await showConfirm(msg)) return;
  var folderPath = prefix + folderName;
  Desktop.deleteByPath(browseTarget, folderPath).then(function(res) {
    if (res && res.ok) {
      browseAllFiles = browseAllFiles.filter(function(f) {
        var rel = normPath(f.relativePath || f.filename || '');
        return rel !== folderPath && !rel.startsWith(folderPath + '/');
      });
      renderBrowse();
    } else {
      showToast(tt('fmDeleteFailed', 'Delete failed.'), true);
    }
  }).catch(function(e) {
    showToast(tt('fmDeleteFailed', 'Delete failed: ') + (e && e.message ? e.message : String(e)), true);
  });
}

function renderBreadcrumb() {
  var bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  var parts = browsePath ? browsePath.split('/') : [];
  var canDrop = true;

  var rootBtn = document.createElement('button');
  rootBtn.className = 'breadcrumb-seg';
  rootBtn.textContent = TARGET_LABELS[browseTarget] || browseTarget;
  rootBtn.dataset.fmDropPath = '';
  rootBtn.addEventListener('dragover', function(ev) {
    if (!canDrop || browseTarget === 'docEditor') return;
    if (!fmDragSelection || !fmDragSelection.length) return;
    ev.preventDefault();
    rootBtn.classList.add('drop-target');
  });
  rootBtn.addEventListener('dragleave', function() { rootBtn.classList.remove('drop-target'); });
  rootBtn.addEventListener('drop', function(ev) {
    if (!canDrop || browseTarget === 'docEditor') return;
    ev.preventDefault();
    rootBtn.classList.remove('drop-target');
    if (fmDragSelection && fmDragSelection.length) {
      fmRunTransfer(fmDragSelection, browseTarget, '', 'move');
    }
  });
  rootBtn.addEventListener('click', function() { browsePath = ''; renderBrowse(); renderBreadcrumb(); });
  bc.appendChild(rootBtn);

  parts.forEach(function(part, idx) {
    var sep = document.createElement('span');
    sep.className = 'breadcrumb-sep';
    sep.textContent = ' / ';
    bc.appendChild(sep);

    var seg = document.createElement('button');
    seg.className = 'breadcrumb-seg';
    var isGradesDir = (browseTarget === 'grades' && idx === 0) || (browseTarget === 'user' && idx === 1 && parts[0] === 'grades');
    var isGroupDir = (browseTarget === 'groupParticipation' && idx === 0) || (browseTarget === 'user' && idx === 1 && (parts[0] === 'group-participation' || parts[0] === 'groupParticipation'));
    var segLabel = (isGradesDir && gradeClassNames[part])
      ? gradeClassNames[part]
      : (isGroupDir && groupClassNames[part])
        ? groupClassNames[part]
        : (browseTarget === 'user' && idx === 0)
          ? fmGetFolderDisplayName(part, true)
          : part;
    seg.textContent = segLabel;
    seg.title = part;
    var segPath = parts.slice(0, idx + 1).join('/');
    var segDest = fmResolveDestination(browseTarget, segPath);
    seg.dataset.fmDropPath = segPath;
    seg.addEventListener('dragover', function(ev) {
      if (!canDrop || !segDest) return;
      if (!fmDragSelection || !fmDragSelection.length) return;
      ev.preventDefault();
      seg.classList.add('drop-target');
    });
    seg.addEventListener('dragleave', function() { seg.classList.remove('drop-target'); });
    seg.addEventListener('drop', function(ev) {
      if (!canDrop || !segDest) return;
      ev.preventDefault();
      seg.classList.remove('drop-target');
      if (fmDragSelection && fmDragSelection.length) {
        fmRunTransfer(fmDragSelection, segDest.target, segDest.path, 'move');
      }
    });
    if (idx === parts.length - 1) {
      seg.disabled = true;
    } else {
      (function(targetPath) {
        seg.addEventListener('click', function() {
          browsePath = targetPath;
          renderBrowse();
          renderBreadcrumb();
        });
      })(parts.slice(0, idx + 1).join('/'));
    }
    bc.appendChild(seg);
  });
}

function renderBrowse() {
  var searchVal = document.getElementById('browseSearch').value.trim().toLowerCase();
  var sortOrder = (document.getElementById('browseSortOrder') || {}).value || 'name-asc';
  var list = document.getElementById('browseList');
  list.innerHTML = '';
  fmVisibleOrder = [];

  var isMergedDocEditor = browseTarget === 'docEditor';
  var canBrowseTransfer = true;
  function getBrowseRel(f) {
    if (isMergedDocEditor) return normPath(f._browseRel || f.relativePath || f.filename || '');
    return normPath(f.relativePath || f.filename || '');
  }

  var prefix = browsePath ? browsePath + '/' : '';

  // Derive immediate subdirectories
  var folderCounts = {};
  browseAllFiles.forEach(function(f) {
    var rel = getBrowseRel(f);
    if (prefix && !rel.startsWith(prefix)) return;
    var rest = rel.slice(prefix.length);
    if (!rest) return;
    var slash = rest.indexOf('/');
    if (slash !== -1) {
      var folder = rest.slice(0, slash);
      folderCounts[folder] = (folderCounts[folder] || 0) + 1;
    } else if (f.isDirectory) {
      // Keep empty folders visible.
      folderCounts[rest] = (folderCounts[rest] || 0);
    }
  });

  // Files directly at current level, or all matching subfolder files when searching
  var levelFiles;
  if (searchVal) {
    levelFiles = browseAllFiles.filter(function(f) {
      if (f.isDirectory) return false;
      var rel = getBrowseRel(f);
      if (prefix && !rel.startsWith(prefix)) return false;
      var filename = (f.filename || '').toLowerCase();
      var relLower = rel.toLowerCase();
      var pretty = prettyName(f.filename || '').toLowerCase();
      var kind = String(f._docKindLabel || '').toLowerCase();
      return filename.indexOf(searchVal) !== -1 ||
             pretty.indexOf(searchVal) !== -1 ||
             relLower.indexOf(searchVal) !== -1 ||
             kind.indexOf(searchVal) !== -1;
    });
  } else {
    levelFiles = browseAllFiles.filter(function(f) {
      var rel = getBrowseRel(f);
      if (prefix && !rel.startsWith(prefix)) return false;
      var rest = rel.slice(prefix.length);
      return rest.indexOf('/') === -1 && rest.length > 0 && !f.isDirectory;
    });
  }

  var folders = Object.keys(folderCounts).sort(function(a, b) {
    var aCount = Number(folderCounts[a]) || 0;
    var bCount = Number(folderCounts[b]) || 0;
    if (sortOrder === 'name-desc') return b.localeCompare(a);
    if (sortOrder === 'size-desc') {
      if (bCount !== aCount) return bCount - aCount;
      return a.localeCompare(b);
    }
    return a.localeCompare(b);
  });

  levelFiles.sort(function(a, b) {
    var aName = String(a.filename || '');
    var bName = String(b.filename || '');
    var aDate = Number(a.mtimeMs) || 0;
    var bDate = Number(b.mtimeMs) || 0;
    var aSize = Number(a.size) || 0;
    var bSize = Number(b.size) || 0;
    if (sortOrder === 'name-desc') return bName.localeCompare(aName);
    if (sortOrder === 'date-desc') return bDate - aDate;
    if (sortOrder === 'date-asc')  return aDate - bDate;
    if (sortOrder === 'size-desc') return bSize - aSize;
    return aName.localeCompare(bName);
  });

  if (!showVersions && browseTarget === 'mindmaps') {
    folders = folders.filter(function(f) { return f !== 'history'; });
    levelFiles = levelFiles.filter(function(f) { return !isVersionFile(f); });
  }

  if (!folders.length && !levelFiles.length) {
    list.innerHTML = '<div class="state-msg"><span class="state-icon">📭</span>' + escHtml(tt('rfNoFiles','No files found.')) + '</div>';
    return;
  }

  // Render folders (hidden when searching to focus on matching files)
  if (!searchVal) {
    folders.forEach(function(folder) {
      var row = document.createElement('div');
      row.className = 'folder-row';
      row.style.cursor = 'default';
      row.draggable = canBrowseTransfer;
      var folderVirtualPath = normPath(prefix + folder);
      var resolvedFolder = fmResolveDestination(browseTarget, folderVirtualPath);
      row.dataset.fmKind = 'folder';
      row.dataset.fmTarget = resolvedFolder ? resolvedFolder.target : browseTarget;
      row.dataset.fmRelPath = resolvedFolder ? resolvedFolder.path : folderVirtualPath;
      row.dataset.fmKey = fmKeyFor({ kind: 'folder', target: row.dataset.fmTarget, relativePath: row.dataset.fmRelPath });
      fmVisibleOrder.push(row.dataset.fmKey);

      var icon = document.createElement('span');
      icon.className = 'folder-icon';
      icon.textContent = '📁';
      icon.style.cursor = 'pointer';

      var nameEl = document.createElement('span');
      nameEl.className = 'folder-name';
      var isGradesDir = (browseTarget === 'grades' && !prefix) || (browseTarget === 'user' && prefix === 'grades/');
      var isGroupDir = (browseTarget === 'groupParticipation' && !prefix) || (browseTarget === 'user' && (prefix === 'group-participation/' || prefix === 'groupParticipation/'));
      var isRootUserDir = (browseTarget === 'user' && !prefix);
      var folderDisplayName = (isGradesDir && gradeClassNames[folder])
        ? gradeClassNames[folder]
        : (isGroupDir && groupClassNames[folder])
          ? groupClassNames[folder]
          : isRootUserDir
            ? fmGetFolderDisplayName(folder, true)
            : folder;
      nameEl.textContent = folderDisplayName;
      nameEl.title = folder;
      nameEl.style.cursor = 'pointer';

      var cnt = document.createElement('span');
      cnt.className = 'folder-count';
      var n = folderCounts[folder];
      cnt.textContent = n + ' ' + tt(n === 1 ? 'rfFile' : 'rfFiles', n === 1 ? 'file' : 'files');

      row.appendChild(icon);
      row.appendChild(nameEl);
      row.appendChild(cnt);

      row.addEventListener('click', function(ev) {
        if (ev.target.closest('button')) return;
        fmHandleBrowseSelection({
          key: row.dataset.fmKey,
          scope: 'browse',
          kind: 'folder',
          target: row.dataset.fmTarget,
          relativePath: normPath(row.dataset.fmRelPath),
          isDirectory: true
        }, ev);
      });

      if (canBrowseTransfer) {
        row.addEventListener('dragstart', function(ev) {
          var selected = fmEnsureSelectionForContext({
            key: row.dataset.fmKey,
            scope: 'browse',
            kind: 'folder',
            target: row.dataset.fmTarget,
            relativePath: normPath(row.dataset.fmRelPath),
            isDirectory: true
          });
          fmDragSelection = selected;
          if (ev.dataTransfer) {
            ev.dataTransfer.effectAllowed = 'move';
            ev.dataTransfer.setData('text/plain', 'fm-drag');
          }
        });
        row.addEventListener('dragend', function() {
          fmDragSelection = null;
          row.classList.remove('drop-target');
        });
        row.addEventListener('dragover', function(ev) {
          if (!fmDragSelection || !fmDragSelection.length) return;
          ev.preventDefault();
          row.classList.add('drop-target');
        });
        row.addEventListener('dragleave', function() { row.classList.remove('drop-target'); });
        row.addEventListener('drop', function(ev) {
          ev.preventDefault();
          row.classList.remove('drop-target');
          if (fmDragSelection && fmDragSelection.length) {
            if (resolvedFolder) {
              fmRunTransfer(fmDragSelection, resolvedFolder.target, resolvedFolder.path, 'move');
            }
          }
        });
      }

      (function(folderName) {
        icon.addEventListener('click', function() { browsePath = prefix + folderName; renderBrowse(); renderBreadcrumb(); });
        nameEl.addEventListener('click', function() { browsePath = prefix + folderName; renderBrowse(); renderBreadcrumb(); });
        cnt.addEventListener('click', function() { browsePath = prefix + folderName; renderBrowse(); renderBreadcrumb(); });
        row.addEventListener('contextmenu', function(e) { fmCtxFolder(e, folderName, prefix); });
      })(folder);

      if (window.Desktop && Desktop.isElectron()) {
        var acts = document.createElement('div');
        acts.className = 'file-actions';
        if (!isMergedDocEditor) {
          var isSystemFolder = (browseTarget === 'user' && !prefix && SYSTEM_FOLDERS.has(folder));
          if (!isSystemFolder) {
            var rnBtn = document.createElement('button');
            rnBtn.className = 'btn-rename';
            rnBtn.textContent = tt('fmRename', 'Rename');
            (function(folderName, ne) {
              rnBtn.onclick = function(e) {
                if (e) e.stopPropagation();
                startFolderRename(row, folderName, ne, prefix);
              };
            })(folder, nameEl);
            acts.appendChild(rnBtn);

            var delBtn = document.createElement('button');
            delBtn.className = 'btn-action';
            delBtn.style.cssText = 'color:#c00;border-color:#c00;';
            delBtn.textContent = tt('fmDelete', 'Delete');
            (function(folderName) {
              delBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                deleteFolderConfirm(folderName, folderCounts[folderName], prefix, row);
              });
            })(folder);
            acts.appendChild(delBtn);
          }
        }

        row.appendChild(acts);
      }

      list.appendChild(row);
    });
  }

  // Render files
  levelFiles.forEach(function(f) {
    var fileObj = Object.assign({}, f, { target: f.target || browseTarget });
    list.appendChild(makeBrowseRow(fileObj));
  });

  fmUpdateSelectionUI();
}

function makeBrowseRow(file) {
  var row = document.createElement('div');
  row.className = 'file-row';
  row.draggable = browseTarget !== 'docEditor';
  row.dataset.fmKind = 'file';
  row.dataset.fmTarget = file.target || browseTarget;
  row.dataset.fmRelPath = normPath(file.relativePath || file.filename);
  row.dataset.fmKey = fmKeyFor({ kind: 'file', target: row.dataset.fmTarget, relativePath: row.dataset.fmRelPath });
  fmVisibleOrder.push(row.dataset.fmKey);
  if (window.Desktop && Desktop.isElectron()) {
    (function(f) {
      row.addEventListener('contextmenu', function(e) { fmCtxBrowse(e, f); });
    })(file);
  }

  row.addEventListener('click', function(ev) {
    if (ev.target.closest('button,input,a')) return;
    fmHandleBrowseSelection({
      key: row.dataset.fmKey,
      scope: 'browse',
      kind: 'file',
      target: row.dataset.fmTarget,
      relativePath: row.dataset.fmRelPath,
      isDirectory: false
    }, ev);
  });

  if (browseTarget !== 'docEditor') {
    row.addEventListener('dragstart', function(ev) {
      var selected = fmEnsureSelectionForContext({
        key: row.dataset.fmKey,
        scope: 'browse',
        kind: 'file',
        target: row.dataset.fmTarget,
        relativePath: row.dataset.fmRelPath,
        isDirectory: false
      });
      fmDragSelection = selected;
      if (ev.dataTransfer) {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', 'fm-drag');
      }
    });
    row.addEventListener('dragend', function() { fmDragSelection = null; });
  }

  var extRaw = (file.filename || '').split('.').pop().toLowerCase();
  var tagText;
  if (/^(js|json)$/.test(extRaw)) tagText = 'Data';
  else if (IMAGE_EXTS.indexOf('.' + extRaw) !== -1) tagText = 'Image';
  else if (SOUND_EXTS.indexOf('.' + extRaw) !== -1) tagText = 'Sound';
  else if (extRaw === 'pdf')  tagText = 'PDF';
  else if (extRaw === 'epub') tagText = 'Book';
  else tagText = extRaw.toUpperCase() || 'FILE';

  var tag = document.createElement('span');
  tag.className = 'file-type-tag';
  tag.textContent = tagText;
  row.appendChild(tag);

  var info = document.createElement('div');
  info.className = 'file-info';

  var nameEl = document.createElement('div');
  nameEl.className = 'file-name';
  nameEl.textContent = file.filename;
  nameEl.title = normPath(file._browseRel || file.relativePath || file.filename);
  info.appendChild(nameEl);

  var meta = document.createElement('div');
  meta.className = 'file-meta';
  var kb = file.size ? (file.size / 1024).toFixed(1) + ' KB' : '';
  var src = file._docKindLabel ? (file._docKindLabel + ' · ') : '';
  var relPath = normPath(file._browseRel || file.relativePath || '');
  var relDir = fmDirName(relPath);
  var dirTag = relDir ? (relDir + ' · ') : '';
  meta.textContent = src + dirTag + formatDate(file.mtimeMs || 0) + (kb ? ' · ' + kb : '');
  info.appendChild(meta);
  row.appendChild(info);

  var acts = document.createElement('div');
  acts.className = 'file-actions';

  var isMindmapsFolderFile = browseTarget === 'mindmaps' || (browseTarget === 'user' && (file.relativePath || '').startsWith('mindmaps/'));
  var isConst = /\.(js|json|cstz|zip)$/i.test(file.filename) && isMindmapsFolderFile && !fmIsTemplateMindmapFile(file);
  if (isConst) {
    var boardBtn = document.createElement('button');
    boardBtn.className = 'btn-open';
    boardBtn.textContent = tt('rfOpenInBoard','Open in Board ↗');
    (function(f) {
      boardBtn.addEventListener('click', function() {
        if (!window.Desktop || !Desktop.isElectron()) return;
        var target = f.target;
        var relPath = f.relativePath || f.filename;
        if (target === 'user' && relPath.startsWith('mindmaps/')) {
          target = 'mindmaps';
          relPath = relPath.slice('mindmaps/'.length);
        }
        Desktop.openTool('board.html', { query: { openSession:'1', openTarget:target, openFilename:f.filename, openRelPath:relPath } });
      });
    })(file);
    acts.appendChild(boardBtn);
  }

  if (window.Desktop && Desktop.isElectron()) {
    // Open in native app
    var nativeBtn = document.createElement('button');
    nativeBtn.className = 'btn-action';
    nativeBtn.textContent = tt('fmOpenNative','Open');
    (function(f) {
      nativeBtn.addEventListener('click', async function() {
        var res = await Desktop.openNative(f.target, f.relativePath || f.filename);
        if (res && !res.ok) showToast(tt('fmOpenNativeFailed','Could not open file:') + ' ' + (res.error || ''), true);
      });
    })(file);
    acts.appendChild(nativeBtn);

    // Edit in Document Editor (markdown and HTML files only)
    if (/\.(md|html)$/i.test(file.filename)) {
      var editBtn = document.createElement('button');
      editBtn.className = 'btn-action';
      editBtn.textContent = tt('fmEditInDocEditor', 'Edit in Doc Editor');
      (function(f) {
        editBtn.addEventListener('click', function() {
          var target = f.target;
          var relPath = f.relativePath || f.filename;
          if (target === 'user') {
            if (relPath.startsWith('document-editor/docs/')) {
              target = 'docEditorDocs';
              relPath = relPath.slice('document-editor/docs/'.length);
            } else if (relPath.startsWith('document-editor/stylesheets/')) {
              target = 'docEditorStylesheets';
              relPath = relPath.slice('document-editor/stylesheets/'.length);
            } else if (relPath.startsWith('document-editor/templates/')) {
              target = 'docEditorTemplates';
              relPath = relPath.slice('document-editor/templates/'.length);
            }
          }
          Desktop.openTool('document-editor.html', {
            query: { editTarget: target, editRelPath: relPath }
          });
        });
      })(file);
      acts.appendChild(editBtn);
    }

    var isSystemFile = (file.target === 'user' && !browsePath && SYSTEM_FILES.has(file.filename));

    if (!isSystemFile) {
      // Duplicate
      var dupBtn = document.createElement('button');
      dupBtn.className = 'btn-action';
      dupBtn.textContent = tt('fmDuplicate','Duplicate');
      (function(f, dBtn) {
        dBtn.addEventListener('click', async function() {
          dBtn.disabled = true;
          try {
            var res = await Desktop.duplicateByPath(f.target, f.relativePath || f.filename);
            if (res && res.ok) {
              var newFile = Object.assign({}, f, {
                filename: res.filename,
                relativePath: res.relativePath,
                size: res.size,
                mtimeMs: res.mtimeMs
              });
              var oldKey = rfSessionCacheKey(f);
              var newKey = rfSessionCacheKey(newFile);
              if (rfSessionTypeCache.has(oldKey) && !rfSessionTypeCache.has(newKey)) {
                rfSessionTypeCache.set(newKey, rfSessionTypeCache.get(oldKey));
              }
              browseAllFiles.push(newFile);
              var newRow = makeBrowseRow(newFile);
              row.parentNode.insertBefore(newRow, row.nextSibling);
            } else {
              showToast(tt('fmDuplicateFailed','Duplicate failed.'), true);
            }
          } catch(e) {
            showToast(tt('fmDuplicateFailed','Duplicate failed:') + ' ' + (e && e.message ? e.message : String(e)), true);
          } finally { dBtn.disabled = false; }
        });
      })(file, dupBtn);
      acts.appendChild(dupBtn);

      // Rename
      var rnBtn = document.createElement('button');
      rnBtn.className = 'btn-rename';
      rnBtn.textContent = tt('fmRename','Rename');
      (function(f, rb) {
        rb.onclick = function(e) {
          if (e) e.stopPropagation();
          startInlineRename(row, f, f.target || browseTarget, null, browseAllFiles);
        };
      })(file, rnBtn);
      acts.appendChild(rnBtn);
    }
  }

  row.appendChild(acts);
  return row;
}

async function loadBrowse(options) {
  options = options || {};
  browseTarget = document.getElementById('browseTarget').value;
  if (!options.preservePath) browsePath = '';
  fmClearSelection();
  renderBreadcrumb();

  var list = document.getElementById('browseList');
  list.innerHTML = '<div class="state-msg"><span class="state-icon">⏳</span>' + escHtml(tt('rfLoading','Loading…')) + '</div>';

  if (!window.Desktop || !Desktop.isElectron()) {
    list.innerHTML = '<div class="state-msg"><span class="state-icon">⚠</span>' + escHtml(tt('rfElectronRequiredPage','Requires the Electron app.')) + '</div>';
    return;
  }

  try {
    if (browseTarget === 'docEditor') {
      var merged = [];
      var docTargets = [
        { target: 'docEditorDocs', label: 'Documents' },
        { target: 'docEditorStylesheets', label: 'CSS' },
        { target: 'docEditorTemplates', label: 'Templates' }
      ];
      for (var i = 0; i < docTargets.length; i++) {
        var t = docTargets[i];
        var r = await Desktop.listByPath(t.target, '', { extensions:[], recursive:true, includeDirectories:true });
        var files = (r && r.ok && Array.isArray(r.files)) ? r.files : [];
        files.forEach(function(f) {
          merged.push(Object.assign({}, f, {
            target: t.target,
            _docKindLabel: t.label,
            _browseRel: normPath(t.label + '/' + (f.relativePath || f.filename || ''))
          }));
        });
      }
      browseAllFiles = merged;
    } else {
      var res = await Desktop.listByPath(browseTarget, '', { extensions:[], recursive:true, includeDirectories:true });
      browseAllFiles = (res && res.ok && Array.isArray(res.files)) ? res.files : [];
    }

    if (browseTarget === 'mindmaps' || browseTarget === 'user') {
      await fmPrimeBrowseSessionTypes(browseAllFiles);
    }
  } catch(e) {
    list.innerHTML = '<div class="state-msg"><span class="state-icon">⚠</span>' + escHtml('Error: ' + (e && e.message ? e.message : String(e))) + '</div>';
    return;
  }

  gradeClassNames = {};
  groupClassNames = {};
  if ((browseTarget === 'grades' || browseTarget === 'user') && typeof Desktop.readByPath === 'function') {
    var classFiles = browseAllFiles.filter(function(f) {
      var rel = normPath(f.relativePath || f.filename || '');
      var parts = rel.split('/');
      if (browseTarget === 'user') {
        return parts.length === 3 && parts[0] === 'grades' && parts[2] === '_class.js';
      } else {
        return parts.length === 2 && parts[1] === '_class.js';
      }
    });
    await Promise.all(classFiles.map(async function(f) {
      try {
        var rel = normPath(f.relativePath || f.filename);
        var parts = rel.split('/');
        var folderId = browseTarget === 'user' ? parts[1] : parts[0];
        var r = await Desktop.readByPath(browseTarget, rel);
        if (r && r.content) {
          var m = r.content.match(/"name"\s*:\s*"([^"]+)"/);
          if (m) gradeClassNames[folderId] = m[1];
        }
      } catch(e) {}
    }));
  }
  if ((browseTarget === 'groupParticipation' || browseTarget === 'user') && typeof Desktop.readByPath === 'function') {
    try {
      var cgr = await Desktop.readByPath('user', 'class-groups.js');
      if (cgr && cgr.content) {
        try {
          var cgFn = new Function(cgr.content + '; return (typeof CLASS_GROUPS_DATA !== "undefined") ? CLASS_GROUPS_DATA.classGroupsMeta : null;');
          var cgMeta = cgFn();
          if (cgMeta && typeof cgMeta === 'object') {
            Object.keys(cgMeta).forEach(function(id) {
              if (cgMeta[id] && cgMeta[id].name) groupClassNames[id] = cgMeta[id].name;
            });
          }
        } catch(e) {}
      }
    } catch(e) {}
  }

  renderBrowse();
}

document.getElementById('browseAddFolder').addEventListener('click', async function() {
  if (!window.Desktop || !Desktop.isElectron() || typeof Desktop.createDirectoryByPath !== 'function') {
    showToast(tt('rfElectronRequiredPage','Requires the Electron app.'), true);
    return;
  }

  var dest = fmResolveDestination(browseTarget, browsePath || '');
  if (!dest) {
    showToast(tt('fmAddFolderRootHint', 'Open Documents, CSS, or Templates first.'), true);
    return;
  }

  var name = await showPrompt(tt('fmAddFolderPrompt', 'New folder name:'), '');
  if (name == null) return;
  var folderName = String(name || '').trim();
  if (!folderName || /[/\\<>:"|?*\x00-\x1f]/.test(folderName) || folderName === '.' || folderName === '..') {
    showToast(tt('fmAddFolderInvalidName', 'Invalid folder name.'), true);
    return;
  }

  var relPath = fmJoinPath(dest.path || '', folderName);
  try {
    var res = await Desktop.createDirectoryByPath(dest.target, relPath);
    if (res && res.ok) {
      showToast(tt('fmAddFolderCreated', 'Folder created.'));
      await loadBrowse({ preservePath: true });
    } else {
      showToast(tt('fmAddFolderFailed', 'Could not create folder.'), true);
    }
  } catch (e) {
    showToast(tt('fmAddFolderFailed', 'Could not create folder:') + ' ' + (e && e.message ? e.message : String(e)), true);
  }
});

document.getElementById('browseList').addEventListener('click', function(ev) {
  if (ev.target === this) fmClearSelection();
});

document.addEventListener('keydown', function(ev) {
  var isBrowseActive = document.getElementById('tab-browse').classList.contains('active');
  var inEditable = !!(ev.target && (ev.target.closest('input,textarea,[contenteditable="true"]')));
  if (ev.key === 'Escape') {
    fmClearSelection();
    return;
  }
  if (!isBrowseActive || inEditable) return;
  var mod = ev.ctrlKey || ev.metaKey;
  if (!mod) return;

  var selected = fmGetCurrentBrowseSelection();

  if (ev.key.toLowerCase() === 'c') {
    if (!selected.length) return;
    ev.preventDefault();
    fmClipboard = { mode: 'copy', items: selected.map(function(it) { return Object.assign({}, it); }) };
    showToast(tt('fmClipboardCopied', 'Copied.') + ' ' + selected.length);
    return;
  }

  if (ev.key.toLowerCase() === 'x') {
    if (!selected.length) return;
    ev.preventDefault();
    fmClipboard = { mode: 'move', items: selected.map(function(it) { return Object.assign({}, it); }) };
    showToast(tt('fmClipboardCut', 'Cut.') + ' ' + selected.length);
    return;
  }

  if (ev.key.toLowerCase() === 'v') {
    if (!fmClipboard || !fmClipboard.items || !fmClipboard.items.length) return;
    ev.preventDefault();
    if (browseTarget === 'docEditor') {
      var docDest = fmResolveDocEditorVirtualPath(browsePath);
      if (!docDest) {
        showToast(tt('fmDocEditorPasteHint', 'Open a concrete Doc Editor target to paste (Documents / Stylesheets / Templates).'), true);
        return;
      }
      fmRunTransfer(fmClipboard.items, docDest.target, docDest.path, fmClipboard.mode === 'move' ? 'move' : 'copy');
      return;
    }
    fmRunTransfer(fmClipboard.items, browseTarget, browsePath, fmClipboard.mode === 'move' ? 'move' : 'copy');
  }
});

<!-- Context menu -->
<div id="fmCtxMenu"></div>
<script>
(function() {
  var menu = document.getElementById('fmCtxMenu');

  function hideCtx() {
    menu.classList.remove('open');
    menu.innerHTML = '';
  }

  document.addEventListener('pointerdown', function(e) {
    if (menu.classList.contains('open') && !menu.contains(e.target)) hideCtx();
  });
  document.addEventListener('contextmenu', function(e) {
    if (menu.classList.contains('open') && !menu.contains(e.target)) hideCtx();
  });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hideCtx(); });

  function showCtx(x, y, items) {
    hideCtx();
    items.forEach(function(item) {
      if (item === '-') {
        var sep = document.createElement('div');
        sep.className = 'ctx-sep';
        menu.appendChild(sep);
      } else {
        var btn = document.createElement('button');
        btn.className = 'ctx-item' + (item.danger ? ' danger' : '');
        btn.textContent = item.label;
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          hideCtx();
          item.action();
        });
        menu.appendChild(btn);
      }
    });
    menu.classList.add('open');
    // Position
    var vw = window.innerWidth, vh = window.innerHeight;
    var mw = menu.offsetWidth || 200, mh = menu.offsetHeight || 180;
    var left = x + mw > vw ? Math.max(0, vw - mw - 4) : x;
    var top  = y + mh > vh ? Math.max(0, vh - mh - 4) : y;
    menu.style.left = left + 'px';
    menu.style.top  = top  + 'px';
  }

  /* ── helpers shared with row builders ── */
  async function ctxOpenNative(target, relPath) {
    if (!window.Desktop || !Desktop.isElectron()) return;
    var res = await Desktop.openNative(target, relPath);
    if (res && !res.ok) showToast(tt('fmOpenNativeFailed','Could not open file.'), true);
  }

  async function ctxShowInFolder(target, relPath) {
    if (!window.Desktop || !Desktop.isElectron()) return;
    await Desktop.showInFolder(target, relPath);
  }

  function fmGetPinType(file) {
    var target = file.target;
    var filename = file.filename || '';
    var relPath = file.relativePath || filename;
    
    if (target === 'mindmaps' || (target === 'user' && relPath.startsWith('mindmaps/'))) {
      if (/\.(js|json)$/i.test(filename)) return 'mindmap';
    }
    if (target === 'docEditorDocs' || (target === 'user' && relPath.startsWith('document-editor/docs/'))) {
      if (/\.(md|html)$/i.test(filename)) return 'doc';
    }
    if (target === 'user' && relPath.startsWith('schedules/')) {
      if (filename.startsWith('schedule-') && filename.endsWith('.js')) return 'schedule';
    }
    return null;
  }

  /* ── Recent-tab file context menu ── */
  window.fmCtxRecent = function(e, file) {
    e.preventDefault();
    e.stopPropagation();
    var isSession = !!(file.target === 'mindmaps' || file.target === 'data');
    var relPath = file.relativePath || file.filename;
    var rowEl = e.currentTarget || e.target;
    while (rowEl && !rowEl.classList.contains('file-row')) rowEl = rowEl.parentElement;

    var pinType = fmGetPinType(file);
    var pinTarget = file.target;
    var pinRelPath = relPath;
    if (pinType === 'mindmap' && pinTarget === 'user' && pinRelPath.startsWith('mindmaps/')) {
      pinTarget = 'mindmaps';
      pinRelPath = pinRelPath.slice('mindmaps/'.length);
    } else if (pinType === 'doc' && pinTarget === 'user' && pinRelPath.startsWith('document-editor/docs/')) {
      pinTarget = 'docEditorDocs';
      pinRelPath = pinRelPath.slice('document-editor/docs/'.length);
    }

    var checkPin = pinType ? Pins.isPinned({ type: pinType, relativePath: pinRelPath, target: pinTarget }) : Promise.resolve(false);

    checkPin.then(function(pinned) {
      var items = [];

      if (pinType) {
        items.push({
          label: pinned ? tt('ctxUnpinItem', 'Unpin from sidebar') : tt('ctxPinItem', 'Pin to sidebar'),
          action: async function() {
            var itemInfo = { type: pinType, relativePath: pinRelPath, target: pinTarget };
            if (pinned) {
              await Pins.unpinItem(itemInfo);
            } else {
              var displayTitle = file.filename;
              if (pinType === 'mindmap') {
                displayTitle = prettyName(file.filename);
              } else if (pinType === 'doc') {
                displayTitle = file.filename.replace(/\.(md|html)$/i, '');
              } else if (pinType === 'schedule') {
                displayTitle = file.filename.replace(/^schedule-/, '').replace(/\.js$/, '');
              }
              await Pins.pinItem(Object.assign({ title: displayTitle }, itemInfo));
            }
          }
        });
        items.push('-');
      }

      if (isSession) {
        items.push({ label: tt('rfOpenInBoard','Open in Board'), action: function() {
          if (!window.Desktop || !Desktop.isElectron()) return;
          Desktop.openTool('board.html', { query: { openSession:'1', openTarget: file.target, openFilename: file.filename, openRelPath: relPath } });
        }});
      }

      var isDoc = /\.(md|html)$/i.test(file.filename);
      if (isDoc) {
        items.push({ label: tt('fmEditInDocEditor', 'Edit in Doc Editor'), action: function() {
          if (!window.Desktop || !Desktop.isElectron()) return;
          var target = file.target;
          var relPath = file.relativePath || file.filename;
          if (target === 'user') {
            if (relPath.startsWith('document-editor/docs/')) {
              target = 'docEditorDocs';
              relPath = relPath.slice('document-editor/docs/'.length);
            } else if (relPath.startsWith('document-editor/stylesheets/')) {
              target = 'docEditorStylesheets';
              relPath = relPath.slice('document-editor/stylesheets/'.length);
            } else if (relPath.startsWith('document-editor/templates/')) {
              target = 'docEditorTemplates';
              relPath = relPath.slice('document-editor/templates/'.length);
            }
          }
          Desktop.openTool('document-editor.html', { query: { editTarget: target, editRelPath: relPath } });
        }});
      }

      items.push({ label: tt('fmOpenNative','Open with default app'), action: function() { ctxOpenNative(file.target, relPath); } });
      items.push({ label: tt('fmShowInFolder','Show in folder'), action: function() { ctxShowInFolder(file.target, relPath); } });
      items.push('-');

      if (isSession) {
        (function(row) {
          items.push({ label: tt('fmRename','Rename'), action: function() {
            if (row) startInlineRename(row, file, file.target || 'mindmaps', prettyName, rfSessions.concat(rfArchivedSessions));
          }});
        })(rowEl);
      }

      items.push({ label: tt('fmMoveTo', 'Move to...'), action: function() {
        fmMoveCopyViaPicker([{
          key: fmKeyFor({ kind: 'file', target: file.target, relativePath: relPath }),
          scope: 'recent',
          kind: 'file',
          target: file.target,
          relativePath: normPath(relPath),
          isDirectory: false
        }], 'move');
      }});
      items.push({ label: tt('fmCopyTo', 'Copy to...'), action: function() {
        fmMoveCopyViaPicker([{
          key: fmKeyFor({ kind: 'file', target: file.target, relativePath: relPath }),
          scope: 'recent',
          kind: 'file',
          target: file.target,
          relativePath: normPath(relPath),
          isDirectory: false
        }], 'copy');
      }});

      items.push({ label: tt('fmDelete','Delete'), danger: true, action: async function() {
        if (!await showConfirm(tt('fmDeleteConfirm','Delete this file? This cannot be undone.'))) return;
        try {
          var r = await Desktop.deleteByPath(file.target, relPath, { trash: true });
          if (r && r.ok) {
            rfSessions = rfSessions.filter(function(x) { return x !== file; });
            rfArchivedSessions = rfArchivedSessions.filter(function(x) { return x !== file; });
            rfDocs = rfDocs.filter(function(x) { return x !== file; });
            rfArchivedDocs = rfArchivedDocs.filter(function(x) { return x !== file; });
            rfRender();
          } else {
            showToast(tt('fmDeleteFailed','Delete failed.'), true);
          }
        } catch(ex) { showToast(tt('fmDeleteFailed','Delete failed.'), true); }
      }});

      showCtx(e.clientX, e.clientY, items);
    });
  };

  /* ── Browse-tab file context menu ── */
  window.fmCtxBrowse = function(e, file) {
    e.preventDefault();
    e.stopPropagation();
    var relPath = file.relativePath || file.filename;
    var isMindmapsFolderFile = file.target === 'mindmaps' || (file.target === 'user' && (file.relativePath || '').startsWith('mindmaps/'));
    var isConst = /\.(js|json|cstz|zip)$/i.test(file.filename) && isMindmapsFolderFile && !fmIsTemplateMindmapFile(file);
    var rowEl = e.currentTarget || e.target;
    while (rowEl && !rowEl.classList.contains('file-row')) rowEl = rowEl.parentElement;
    var itemForContext = {
      key: rowEl ? rowEl.dataset.fmKey : fmKeyFor({ kind: 'file', target: file.target, relativePath: relPath }),
      scope: 'browse',
      kind: 'file',
      target: file.target,
      relativePath: normPath(relPath),
      isDirectory: false
    };
    var selectedForContext = fmEnsureSelectionForContext(itemForContext);

    var pinType = fmGetPinType(file);
    var pinTarget = file.target;
    var pinRelPath = relPath;
    if (pinType === 'mindmap' && pinTarget === 'user' && pinRelPath.startsWith('mindmaps/')) {
      pinTarget = 'mindmaps';
      pinRelPath = pinRelPath.slice('mindmaps/'.length);
    } else if (pinType === 'doc' && pinTarget === 'user' && pinRelPath.startsWith('document-editor/docs/')) {
      pinTarget = 'docEditorDocs';
      pinRelPath = pinRelPath.slice('document-editor/docs/'.length);
    }

    var checkPin = pinType ? Pins.isPinned({ type: pinType, relativePath: pinRelPath, target: pinTarget }) : Promise.resolve(false);

    checkPin.then(function(pinned) {
      var items = [];

      if (pinType) {
        items.push({
          label: pinned ? tt('ctxUnpinItem', 'Unpin from sidebar') : tt('ctxPinItem', 'Pin to sidebar'),
          action: async function() {
            var itemInfo = { type: pinType, relativePath: pinRelPath, target: pinTarget };
            if (pinned) {
              await Pins.unpinItem(itemInfo);
            } else {
              var displayTitle = file.filename;
              if (pinType === 'mindmap') {
                displayTitle = prettyName(file.filename);
              } else if (pinType === 'doc') {
                displayTitle = file.filename.replace(/\.(md|html)$/i, '');
              } else if (pinType === 'schedule') {
                displayTitle = file.filename.replace(/^schedule-/, '').replace(/\.js$/, '');
              }
              await Pins.pinItem(Object.assign({ title: displayTitle }, itemInfo));
            }
          }
        });
        items.push('-');
      }

      if (isConst) {
        items.push({ label: tt('rfOpenInBoard','Open in Board'), action: function() {
          if (!window.Desktop || !Desktop.isElectron()) return;
          var target = file.target;
          var relPath = file.relativePath || file.filename;
          if (target === 'user' && relPath.startsWith('mindmaps/')) {
            target = 'mindmaps';
            relPath = relPath.slice('mindmaps/'.length);
          }
          Desktop.openTool('board.html', { query: { openSession:'1', openTarget: target, openFilename: file.filename, openRelPath: relPath } });
        }});
      }

      var isDoc = /\.(md|html)$/i.test(file.filename);
      if (isDoc) {
        items.push({ label: tt('fmEditInDocEditor', 'Edit in Doc Editor'), action: function() {
          if (!window.Desktop || !Desktop.isElectron()) return;
          var target = file.target;
          var relPath = file.relativePath || file.filename;
          if (target === 'user') {
            if (relPath.startsWith('document-editor/docs/')) {
              target = 'docEditorDocs';
              relPath = relPath.slice('document-editor/docs/'.length);
            } else if (relPath.startsWith('document-editor/stylesheets/')) {
              target = 'docEditorStylesheets';
              relPath = relPath.slice('document-editor/stylesheets/'.length);
            } else if (relPath.startsWith('document-editor/templates/')) {
              target = 'docEditorTemplates';
              relPath = relPath.slice('document-editor/templates/'.length);
            }
          }
          Desktop.openTool('document-editor.html', { query: { editTarget: target, editRelPath: relPath } });
        }});
      }

      items.push({ label: tt('fmOpenNative','Open with default app'), action: function() { ctxOpenNative(file.target, relPath); } });
      items.push({ label: tt('fmShowInFolder','Show in folder'), action: function() { ctxShowInFolder(file.target, relPath); } });
      items.push('-');
      items.push({ label: tt('fmMoveTo', 'Move to...'), action: function() {
        fmMoveCopyViaPicker(selectedForContext, 'move');
      }});
      items.push({ label: tt('fmCopyTo', 'Copy to...'), action: function() {
        fmMoveCopyViaPicker(selectedForContext, 'copy');
      }});

      var isSystemFile = (file.target === 'user' && !browsePath && SYSTEM_FILES.has(file.filename));
      if (!isSystemFile) {
        items.push('-');
        items.push({ label: tt('fmDuplicate','Duplicate'), action: async function() {
          try {
            var res = await Desktop.duplicateByPath(file.target, relPath);
            if (res && res.ok) {
              var newFile = Object.assign({}, file, { filename: res.filename, relativePath: res.relativePath, size: res.size, mtimeMs: res.mtimeMs });
              browseAllFiles.push(newFile);
              renderBrowse();
            } else { showToast(tt('fmDuplicateFailed','Duplicate failed.'), true); }
          } catch(ex) { showToast(tt('fmDuplicateFailed','Duplicate failed.'), true); }
        }});
        (function(row) {
          items.push({ label: tt('fmRename','Rename'), action: function() {
            if (row) startInlineRename(row, file, file.target || browseTarget, null, browseAllFiles);
          }});
        })(rowEl);
        items.push('-');
        items.push({ label: tt('fmDelete','Delete'), danger: true, action: async function() {
          if (!await showConfirm(tt('fmDeleteConfirm','Delete this file? This cannot be undone.'))) return;
          try {
            var r = await Desktop.deleteByPath(file.target, relPath, { trash: true });
            if (r && r.ok) {
              browseAllFiles = browseAllFiles.filter(function(x) { return x !== file; });
              renderBrowse();
            } else { showToast(tt('fmDeleteFailed','Delete failed.'), true); }
          } catch(ex) { showToast(tt('fmDeleteFailed','Delete failed.'), true); }
        }});
      }

      showCtx(e.clientX, e.clientY, items);
    });
  };

  /* ── Browse-tab folder context menu ── */
  window.fmCtxFolder = function(e, folderName, prefix) {
    e.preventDefault();
    e.stopPropagation();
    var relPath = (prefix || '') + folderName;
    var rowEl = e.currentTarget || e.target;
    while (rowEl && !rowEl.classList.contains('folder-row')) rowEl = rowEl.parentElement;
    var itemForContext = {
      key: rowEl ? rowEl.dataset.fmKey : fmKeyFor({ kind: 'folder', target: browseTarget, relativePath: relPath }),
      scope: 'browse',
      kind: 'folder',
      target: rowEl && rowEl.dataset.fmTarget ? rowEl.dataset.fmTarget : browseTarget,
      relativePath: rowEl && rowEl.dataset.fmRelPath ? normPath(rowEl.dataset.fmRelPath) : normPath(relPath),
      isDirectory: true
    };
    var selectedForContext = fmEnsureSelectionForContext(itemForContext);
    var nameEl = rowEl ? rowEl.querySelector('.folder-name') : null;
    var displayTitle = nameEl ? nameEl.textContent : folderName;

    var checkPin = Pins.isPinned({ type: 'folder', relativePath: itemForContext.relativePath, target: itemForContext.target });
    checkPin.then(function(pinned) {
      var items = [];

      items.push({
        label: pinned ? tt('ctxUnpinItem', 'Unpin from sidebar') : tt('ctxPinItem', 'Pin to sidebar'),
        action: async function() {
          var itemInfo = { type: 'folder', relativePath: itemForContext.relativePath, target: itemForContext.target };
          if (pinned) {
            await Pins.unpinItem(itemInfo);
          } else {
            await Pins.pinItem(Object.assign({ title: displayTitle }, itemInfo));
          }
        }
      });
      items.push('-');

      items.push({ label: tt('fmShowInFolder','Show in folder'), action: function() { ctxShowInFolder(itemForContext.target, itemForContext.relativePath); } });
      items.push('-');
      items.push({ label: tt('fmMoveTo', 'Move to...'), action: function() {
        fmMoveCopyViaPicker(selectedForContext, 'move');
      }});
      items.push({ label: tt('fmCopyTo', 'Copy to...'), action: function() {
        fmMoveCopyViaPicker(selectedForContext, 'copy');
      }});

      var isSystemFolder = (itemForContext.target === 'user' && !prefix && SYSTEM_FOLDERS.has(folderName));
      if (!isSystemFolder) {
        items.push('-');
        (function(row, ne) {
          if (browseTarget !== 'docEditor') {
            items.push({ label: tt('fmRename','Rename'), action: function() {
              if (row && ne) startFolderRename(row, folderName, ne, prefix || '');
            }});
          }

          items.push({ label: tt('fmDelete','Delete'), danger: true, action: async function() {
            var folderLabel = (browseTarget === 'docEditor') ? (itemForContext.relativePath || folderName) : folderName;
            var msg = tt('fmDeleteFolderConfirm', 'Delete folder "{name}"?\n\nThis will permanently delete all files inside. This cannot be undone.').replace('{name}', folderLabel);
            if (!await showConfirm(msg)) return;
            try {
              var r = await Desktop.deleteByPath(itemForContext.target, itemForContext.relativePath, { recursive: true, force: true });
              if (r && r.ok) {
                await loadBrowse({ preservePath: true });
              } else {
                showToast(tt('fmDeleteFailed','Delete failed.'), true);
              }
            } catch (ex) {
              showToast(tt('fmDeleteFailed','Delete failed.') + ' ' + (ex && ex.message ? ex.message : String(ex)), true);
            }
          }});
        })(rowEl, nameEl);
      }

      showCtx(e.clientX, e.clientY, items);
    });
  };
})();
</script>
<script>
function openFmShortcuts() {
  ShortcutsModal.open({
    title: t('skmTitle'),
    noShortcutsText: t('skmNone'),
    rows: [
      { keys: ['Enter'], desc: t('skmFmConfirm') },
      { keys: ['Escape'], desc: t('skmFmCancel') },
      { keys: ['Ctrl/Cmd', 'C'], desc: tt('fmClipboardCopied', 'Copy selected') },
      { keys: ['Ctrl/Cmd', 'X'], desc: tt('fmClipboardCut', 'Cut selected') },
      { keys: ['Ctrl/Cmd', 'V'], desc: tt('fmClipboardPaste', 'Paste into current folder') }
    ]
  });
}
</script>
