<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <link rel="stylesheet" href="../modules/lexend/lexend.css">
  <script src="../electron-bridge.js"></script>
  <script src="../js/pins.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/shortcuts-modal.js"></script>
  <script src="../js/dialogs.js"></script>
  <script src="../js/menus.js"></script>
  <link rel="stylesheet" href="../css/file-manager.css">
</head>
<body>
<nav id="app-nav">
  <span class="nav-brand"></span>
  <div id="app-hamburger" class="hm-wrap">
    <button class="tut-trigger-btn" onclick="openFmShortcuts()" data-i18n-title="skmTitle" title="Keyboard Shortcuts">?</button>
    <button class="tut-trigger-btn" onclick="ShortcutsModal.open({title:t('tourBtnLabel'),rows:[],noShortcutsText:t('skmTourSoon')})" data-i18n="tourBtnLabel" data-i18n-title="tourBtnLabel" data-icon="../assets/icons/play.svg"><img src="../assets/icons/play.svg" class="btn-icon" alt="" /> Tour</button>
    <button class="hm-btn" aria-label="Open menu">☰</button>
    <div class="hm-menu"></div>
  </div>
</nav>
<div class="page">

  <button class="back-link" id="backBtn" data-i18n="btnBack">← Back to Launcher</button>

  <h1 class="page-title" data-i18n="fmTitle">File Manager</h1>
  <p class="page-subtitle" data-i18n="fmSubtitle">Browse and rename your data files.</p>

  <!-- ── Tabs ── -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="recent" data-i18n="fmTabRecent">Recent</button>
    <button class="tab-btn" data-tab="browse" data-i18n="fmTabBrowse">Browse</button>
  </div>

  <!-- ══ RECENT TAB ══════════════════════════════════════════════ -->
  <div id="tab-recent" class="tab-panel active">
    <div class="toolbar">
      <input type="search" id="rfSearch" placeholder="Search files…" data-i18n-placeholder="rfSearchPlaceholder">
      <select id="rfTypeFilter">
        <option value="all" data-i18n="rfFilterAll">All types</option>
        <optgroup label="Session files" data-i18n-label="rfFilterSessions">
          <option value="mindmaps" data-i18n="rfFilterMindmaps">Constellation maps</option>
        </optgroup>
        <optgroup label="Documents" data-i18n-label="rfFilterDocs">
          <option value="doceditor">Doc Editor files</option>
          <option value="pdf">PDF</option>
          <option value="image">Image</option>
          <option value="sound">Sound</option>
          <option value="book">Book</option>
        </optgroup>
      </select>
      <select id="rfSortOrder">
        <option value="date-desc" data-i18n="rfSortNewest">Newest first</option>
        <option value="date-asc" data-i18n="rfSortOldest">Oldest first</option>
        <option value="name-asc" data-i18n="rfSortNameAZ">Name A→Z</option>
        <option value="name-desc" data-i18n="rfSortNameZA">Name Z→A</option>
        <option value="size-desc" data-i18n="rfSortLargest">Largest first</option>
      </select>
      <label id="rfVersionsToggleLabel" style="display:flex;align-items:center;gap:5px;font-size:0.83rem;font-weight:700;cursor:pointer;white-space:nowrap;">
        <input type="checkbox" id="rfShowVersions" style="width:14px;height:14px;accent-color:#000;cursor:pointer;">
        <span data-i18n="rfShowVersions">Show versions</span>
      </label>
      <span class="result-count" id="rfCount"></span>
    </div>
    <div class="file-list" id="rfList">
      <div class="state-msg"><span class="state-icon">⏳</span><span data-i18n="rfLoading">Loading files…</span></div>
    </div>
    <h2 class="section-heading" id="rfEditorDocsHeading" style="display:none">Doc Editor Files</h2>
    <div class="file-list" id="rfEditorDocsList"></div>
    <h2 class="section-heading" id="rfDocsHeading" style="display:none" data-i18n="rfDocsHeading">Added Documents</h2>
    <div class="file-list" id="rfDocsList"></div>
    <h2 class="section-heading" id="rfArchivedHeading" style="display:none" data-i18n="rfArchivedHeading">Archived</h2>
    <div class="file-list" id="rfArchivedList"></div>
  </div>

  <!-- ══ BROWSE TAB ══════════════════════════════════════════════ -->
  <div id="tab-browse" class="tab-panel">
    <div class="browse-toolbar">
      <select id="browseTarget" class="browse-target-select" style="display: none;">
        <option value="user" data-i18n="fmTargetUser">User Data</option>
      </select>
      <select id="browseSortOrder">
        <option value="name-asc" data-i18n="rfSortNameAZ">Name A→Z</option>
        <option value="name-desc" data-i18n="rfSortNameZA">Name Z→A</option>
        <option value="date-desc" data-i18n="rfSortNewest">Newest first</option>
        <option value="date-asc" data-i18n="rfSortOldest">Oldest first</option>
        <option value="size-desc" data-i18n="rfSortLargest">Largest first</option>
      </select>
      <input type="search" id="browseSearch" class="browse-search" placeholder="Filter…" data-i18n-placeholder="fmBrowseFilter">
      <button id="browseRefresh" class="btn-refresh" data-i18n="fmRefresh">↺ Refresh</button>
      <button id="browseAddFolder" class="btn-refresh" data-i18n="fmAddFolder">+ Folder</button>
      <label id="browseVersionsToggleLabel" style="display:flex;align-items:center;gap:5px;font-size:0.83rem;font-weight:700;cursor:pointer;white-space:nowrap;">
        <input type="checkbox" id="browseShowVersions" style="width:14px;height:14px;accent-color:#000;cursor:pointer;">
        <span data-i18n="rfShowVersions">Show versions</span>
      </label>
    </div>
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="browseList" class="file-list">
      <div class="state-msg"><span class="state-icon">⏳</span><span data-i18n="rfLoading">Loading…</span></div>
    </div>
  </div>

</div>

<div id="fmPickerOverlay" class="fm-modal-overlay" style="display:none;" role="dialog" aria-modal="true">
  <div class="fm-modal">
    <div class="fm-modal-header" id="fmPickerTitle">Move to...</div>
    <div class="fm-modal-body">
      <div class="fm-picker-toolbar">
        <label for="fmPickerTarget" style="font-size:0.8rem;font-weight:700;">Target</label>
        <select id="fmPickerTarget"></select>
        <button id="fmPickerUpBtn" type="button">Up</button>
      </div>
      <div class="fm-picker-path" id="fmPickerPath">/</div>
      <div class="fm-picker-list" id="fmPickerList"></div>
    </div>
    <div class="fm-modal-footer">
      <button class="btn-outline" id="fmPickerCancelBtn" type="button" data-i18n="btnCancel">Cancel</button>
      <button class="btn" id="fmPickerChooseBtn" type="button">Choose this folder</button>
    </div>
  </div>
</div>

<div id="fmConflictOverlay" class="fm-modal-overlay" style="display:none;" role="dialog" aria-modal="true">
  <div class="fm-modal" style="max-width:560px;">
    <div class="fm-modal-header" id="fmConflictTitle">Conflict Detected</div>
    <div class="fm-modal-body">
      <p id="fmConflictMsg" style="font-size:0.88rem;font-weight:600;line-height:1.45;"></p>
      <div id="fmConflictName" class="fm-conflict-name"></div>
      <div class="fm-conflict-actions">
        <button class="btn-outline" id="fmConflictRenameBtn" type="button">Rename</button>
        <button class="btn-outline" id="fmConflictReplaceBtn" type="button">Replace</button>
        <button class="btn-outline" id="fmConflictSkipBtn" type="button">Skip</button>
      </div>
    </div>
  </div>
</div>

<script>

/* ════════════════════════════════════════════
   UTILITIES
   ════════════════════════════════════════════ */

function tt(key, fallback) {
  return (typeof t === 'function' ? t(key) : null) || fallback;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatDate(ms) {
  if (!ms) return '—';
  var d = new Date(ms);
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) +
         ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}

function fileDateMs(f) { return f.savedAt || f.createdAt || f.mtimeMs || 0; }

function prettyName(fn) {
  return fn.replace(/\.(js|json)$/i, '').replace(/_/g, ' ').replace(/-Autosave$/, ' (autosave)').trim();
}

function escRegex(s) { return s.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'); }

var IMAGE_EXTS = ['.png','.jpg','.jpeg','.gif','.webp','.svg'];
var SOUND_EXTS = ['.mp3','.wav','.ogg','.m4a','.aac'];
var DOC_EXTS   = IMAGE_EXTS.concat(SOUND_EXTS, ['.pdf','.epub']);

function docTypeInfo(fn) {
  var ext = '.' + (fn||'').split('.').pop().toLowerCase();
  if (IMAGE_EXTS.indexOf(ext) !== -1) return { label:'Image' };
  if (SOUND_EXTS.indexOf(ext) !== -1) return { label:'Sound' };
  if (ext === '.pdf')  return { label:'PDF', key:'pdf' };
  if (ext === '.epub') return { label:'Book', key:'book' };
  return { label: ext.slice(1).toUpperCase() || 'FILE', key: ext.slice(1) };
}
function docTypeKey(fn) {
  var ext = '.' + (fn||'').split('.').pop().toLowerCase();
  if (IMAGE_EXTS.indexOf(ext) !== -1) return 'image';
  if (SOUND_EXTS.indexOf(ext) !== -1) return 'sound';
  if (ext === '.pdf')  return 'pdf';
  if (ext === '.epub') return 'book';
  return '';
}

function normPath(p) { return (p||'').replace(/\\/g, '/'); }

function isVersionFile(f) {
  return normPath(f.relativePath || f.filename || '').split('/').indexOf('history') !== -1;
}

var showVersions = false;

/* ════════════════════════════════════════════
   TAB SWITCHING
   ════════════════════════════════════════════ */

var browseFirstLoad = false;

document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'browse' && !browseFirstLoad) { browseFirstLoad = true; loadBrowse(); }
  });
});

/* ════════════════════════════════════════════
   BACK BUTTON
   ════════════════════════════════════════════ */

document.getElementById('backBtn').addEventListener('click', function() {
  if (window.parent !== window) { window.parent.postMessage('cmt-close-modal', '*'); return; }
  if (window.Desktop && Desktop.isElectron()) window.close();
  else window.location.href = 'launcher.html';
});

/* ════════════════════════════════════════════
   RENAME LOGIC (shared)
   ════════════════════════════════════════════ */

function startInlineRename(row, file, target, onRenamed, siblings) {
  if (row.dataset.renaming === '1') return;
  row.dataset.renaming = '1';

  var resolvedTarget = target || (file ? file.target : null) || (typeof browseTarget !== 'undefined' ? browseTarget : 'user');
  var nameEl      = row.querySelector('.file-name');
  var renameBtn   = row.querySelector('.btn-rename');
  var oldFilename = file.filename;
  var dotIdx      = oldFilename.lastIndexOf('.');
  var base = dotIdx > 0 ? oldFilename.slice(0, dotIdx) : oldFilename;
  var ext  = dotIdx > 0 ? oldFilename.slice(dotIdx) : '';

  nameEl.classList.add('editing');
  var inp = document.createElement('input');
  inp.className = 'rename-input';
  inp.type = 'text';
  inp.value = base;
  nameEl.textContent = '';
  nameEl.appendChild(inp);

  var warnEl = document.createElement('span');
  warnEl.className = 'rename-warn';
  nameEl.appendChild(warnEl);

  var origBtnText = renameBtn ? renameBtn.textContent : tt('fmRename', 'Rename');
  if (renameBtn) renameBtn.textContent = tt('fmSave', 'Save');

  var done = false;

  function showWarn(msg) {
    warnEl.textContent = msg || '';
    inp.classList.toggle('invalid', !!msg);
  }

  function cancelRename() {
    if (done) return;
    done = true;
    nameEl.textContent = onRenamed ? prettyName(oldFilename) : oldFilename;
    nameEl.classList.remove('editing');
    if (renameBtn) {
      renameBtn.textContent = origBtnText;
      row.dataset.renaming = '';
      renameBtn.onclick = function(e) {
        if (e) e.stopPropagation();
        startInlineRename(row, file, resolvedTarget, onRenamed, siblings);
      };
    } else {
      row.dataset.renaming = '';
    }
  }

  async function confirmRename() {
    if (done) return;
    var newBase = inp.value.trim();
    if (!newBase) { showWarn(tt('fmRenameEmpty', 'Name cannot be empty.')); return; }
    if ((newBase + ext) === oldFilename) { cancelRename(); return; }
    if (/[/\\<>:"|?*\x00-\x1f]/.test(newBase)) {
      showWarn(tt('fmRenameInvalidChars', 'Name contains invalid characters (\\ / : * ? " < > |).')); return;
    }
    if ((newBase + ext).length > 255) {
      showWarn(tt('fmRenameNameTooLong', 'Name is too long (max 255 characters).')); return;
    }
    var newFilename = newBase + ext;
    var oldRelPath  = normPath(file.relativePath || file.filename);
    var dir = oldRelPath.includes('/') ? oldRelPath.slice(0, oldRelPath.lastIndexOf('/') + 1) : '';
    var newRelPath  = dir + newFilename;
    if (siblings) {
      var conflict = siblings.some(function(s) {
        var sRel = normPath(s.relativePath || s.filename);
        return sRel !== oldRelPath && sRel === newRelPath;
      });
      if (conflict) { showWarn(tt('fmRenameConflict', 'A file with this name already exists.')); return; }
    }
    done = true;

    if (!window.Desktop || !Desktop.isElectron()) { cancelRename(); return; }

    try {
      var pathParts = oldRelPath.split('/').filter(Boolean);
      var isMindmapSession = resolvedTarget === 'mindmaps' && pathParts.length === 2;

      if (isMindmapSession && typeof Desktop.listByPath === 'function') {
        var oldFolder = pathParts[0];
        var oldSessionBase = oldFilename.replace(/\.(js|json)$/i, '');
        if (oldFolder === oldSessionBase && oldFolder !== newBase) {
          var fr = await Desktop.renameByPath(resolvedTarget, oldFolder, newBase);
          if (!fr || !fr.ok) throw new Error((fr && fr.error) ? fr.error : 'Rename directory failed.');

          var innerFrom = newBase + '/' + oldFilename;
          var innerTo   = newBase + '/' + newFilename;
          if (innerFrom !== innerTo) {
            await Desktop.renameByPath(resolvedTarget, innerFrom, innerTo).catch(function(){});
          }

          var histPath = newBase + '/history';
          try {
            var listed = await Desktop.listByPath(resolvedTarget, histPath, { extensions: ['.js', '.json'], recursive: false });
            var vFiles = (listed && listed.ok && Array.isArray(listed.files)) ? listed.files : [];
            for (var vi = 0; vi < vFiles.length; vi++) {
              var vfname = (vFiles[vi].relativePath || '').split('/').pop() || vFiles[vi].filename || '';
              if (vfname.startsWith(oldSessionBase + '.v')) {
                var suffix = vfname.slice(oldSessionBase.length);
                await Desktop.renameByPath(resolvedTarget, histPath + '/' + vfname, histPath + '/' + newBase + suffix).catch(function(){});
              }
            }
          } catch(e) {}

          if (window.Pins && typeof Pins.updatePinPath === 'function') {
            await Pins.updatePinPath(resolvedTarget, oldFolder, newBase, prettyName(newFilename));
          }

          file.filename     = newFilename;
          file.relativePath = newBase + '/' + newFilename;
          file.target       = resolvedTarget;

          browseAllFiles.forEach(function(f) {
            var rel = normPath(f.relativePath || f.filename || '');
            if (rel === oldFolder || rel.startsWith(oldFolder + '/')) {
              f.relativePath = newBase + rel.slice(oldFolder.length);
              if (f.filename === oldFilename) f.filename = newFilename;
            }
          });
        } else {
          var r = await Desktop.renameByPath(resolvedTarget, oldRelPath, newRelPath);
          if (!r || !r.ok) throw new Error((r && r.error) ? r.error : 'Rename failed.');
          file.filename     = newFilename;
          file.relativePath = newRelPath;
          file.target       = resolvedTarget;
          if (window.Pins && typeof Pins.updatePinPath === 'function') {
            await Pins.updatePinPath(resolvedTarget, oldRelPath, newRelPath, prettyName(newFilename));
          }
        }
      } else {
        var res = await Desktop.renameByPath(resolvedTarget, oldRelPath, newRelPath);
        if (!res || !res.ok) throw new Error((res && res.error) ? res.error : 'Rename failed.');

        file.filename     = newFilename;
        file.relativePath = newRelPath;
        file.target       = resolvedTarget;

        if (window.Pins && typeof Pins.updatePinPath === 'function') {
          await Pins.updatePinPath(resolvedTarget, oldRelPath, newRelPath, newFilename.replace(/\.(md|html)$/i, ''));
        }
      }

      if (file._browseRel) {
        var bDir = file._browseRel.includes('/') ? file._browseRel.slice(0, file._browseRel.lastIndexOf('/') + 1) : '';
        file._browseRel = bDir + newFilename;
      }

      if (typeof browseAllFiles !== 'undefined' && Array.isArray(browseAllFiles)) {
        browseAllFiles.forEach(function(s) {
          var sRel = normPath(s.relativePath || s.filename || '');
          if (sRel === oldRelPath) {
            s.filename = newFilename;
            s.relativePath = newRelPath;
            if (s._browseRel) {
              var bDir = s._browseRel.includes('/') ? s._browseRel.slice(0, s._browseRel.lastIndexOf('/') + 1) : '';
              s._browseRel = bDir + newFilename;
            }
          }
        });
      }

      if (row.dataset) {
        row.dataset.fmTarget = resolvedTarget;
        row.dataset.fmRelPath = normPath(file.relativePath);
        row.dataset.fmKey = fmKeyFor({ kind: 'file', target: resolvedTarget, relativePath: file.relativePath });
      }

      var displayName = onRenamed ? onRenamed(newFilename) : newFilename;
      nameEl.textContent = displayName;
      nameEl.title = normPath(file._browseRel || file.relativePath);
      nameEl.classList.remove('editing');

      if (renameBtn) {
        renameBtn.textContent = origBtnText;
        row.dataset.renaming = '';
        renameBtn.onclick = function(e) {
          if (e) e.stopPropagation();
          startInlineRename(row, file, resolvedTarget, onRenamed, siblings);
        };
      } else {
        row.dataset.renaming = '';
      }

      if (document.getElementById('tab-browse') && document.getElementById('tab-browse').classList.contains('active')) {
        await loadBrowse({ preservePath: true });
      }
      if (document.getElementById('tab-recent') && document.getElementById('tab-recent').classList.contains('active')) {
        await loadRecent();
      }
    } catch(e) {
      showWarn(tt('fmRenameFailed','Rename failed:') + ' ' + (e && e.message ? e.message : String(e)));
      done = false;
    }
  }

  if (renameBtn) {
    renameBtn.onpointerdown = function(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      confirmRename();
    };
    renameBtn.onclick = function(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      confirmRename();
    };
  }

  inp.addEventListener('input', function() { showWarn(''); });
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') confirmRename();
    if (e.key === 'Escape') cancelRename();
  });
  inp.addEventListener('blur', function() {
    setTimeout(function() { if (!done) cancelRename(); }, 180);
  });
  inp.focus();
  inp.select();
}

/* ════════════════════════════════════════════
   RECENT TAB
   ════════════════════════════════════════════ */

var rfSessions = [];
var rfDocs     = [];
var rfEditorDocs = [];
var rfArchivedSessions  = [];
var rfArchivedDocs      = [];
var rfArchivedEditorDocs = [];
var rfContentCache     = new Map();
var rfSessionTypeCache = new Map();
var rfSearchTimer      = null;
var rfSearchGeneration = 0;

function rfExtractSessionType(raw) {
  var text = String(raw || '');
  var typeMatch = text.match(/"_type"\s*:\s*"([^"]+)"/);
  if (typeMatch && typeMatch[1]) return typeMatch[1];
  var legacyMatch = text.match(/"_typ"\s*:\s*"([^"]+)"/);
  if (legacyMatch && legacyMatch[1]) return legacyMatch[1];
  return '';
}

function rfIsTemplateType(typeValue) {
  var tval = String(typeValue || '');
  return tval === 'constellation-template' || /template/i.test(tval);
}

function rfSessionCacheKey(fileObj) {
  var target = (fileObj && fileObj.target) ? fileObj.target : 'mindmaps';
  var rel = (fileObj && (fileObj.relativePath || fileObj.filename)) || '';
  return target + ':' + normPath(rel);
}

async function rfFilterOutTemplateSessions(files) {
  if (!(window.Desktop && Desktop.isElectron())) {
    return Array.isArray(files) ? files : [];
  }
  var list = Array.isArray(files) ? files : [];
  if (!list.length) return list;

  var missing = [];
  list.forEach(function(f) {
    var key = rfSessionCacheKey(f);
    var st = f.sessionType || f._type;
    if (st !== undefined) {
      rfSessionTypeCache.set(key, st || '');
    } else if (!rfSessionTypeCache.has(key)) {
      missing.push(f);
    }
  });

  if (missing.length > 0) {
    var BATCH = 8;
    for (var i = 0; i < missing.length; i += BATCH) {
      var batch = missing.slice(i, i + BATCH);
      await Promise.all(batch.map(async function(f) {
        var key = rfSessionCacheKey(f);
        var rel = f.relativePath || f.filename || '';
        var isArchive = rel.endsWith('.cstz') || rel.endsWith('.zip');
        if (isArchive && typeof Desktop.inspectBoardArchive === 'function') {
          try {
            var insp = await Desktop.inspectBoardArchive(f.target || 'mindmaps', rel);
            rfSessionTypeCache.set(key, (insp && insp.manifest && insp.manifest._type) || 'constellation');
            return;
          } catch(e) {
            rfSessionTypeCache.set(key, 'constellation');
            return;
          }
        }
        if (typeof Desktop.readByPath === 'function') {
          try {
            var result = await Desktop.readByPath(f.target || 'mindmaps', rel);
            var raw = result && result.content ? result.content : '';
            rfSessionTypeCache.set(key, rfExtractSessionType(raw));
          } catch(e) {
            rfSessionTypeCache.set(key, '');
          }
        }
      }));
    }
  }

  return list.filter(function(f) {
    return !rfIsTemplateType(rfSessionTypeCache.get(rfSessionCacheKey(f)));
  });
}

function fmIsMindmapSessionFile(file) {
  var rel = String((file && (file.relativePath || file.filename)) || '').replace(/\\/g, '/');
  var parts = rel.split('/').filter(Boolean);
  var filename = String((file && file.filename) || (parts.length ? parts[parts.length - 1] : ''));
  if (!filename) return false;
  if (/-Autosave\.(js|json|cstz|zip)$/i.test(filename)) return false;
  if (/\.v\d{8}-\d{6}\.(js|json|cstz|zip)$/i.test(filename)) return false;
  if (rel.indexOf('/history/') !== -1 || rel.startsWith('history/')) return false;
  if (rel.indexOf('/media/') !== -1 || rel.startsWith('media/')) return false;
  if (rel.indexOf('/audio/') !== -1 || rel.startsWith('audio/')) return false;
  if (rel.indexOf('/page-snapshots/') !== -1 || rel.startsWith('page-snapshots/')) return false;
  if (parts.length === 3 && parts[0] === 'archived') {
    return filename.replace(/\.(js|json|cstz|zip)$/i, '').toLowerCase() === parts[1].toLowerCase();
  }
  if (parts.length === 2 && parts[0] === 'archived') return true;
  if (parts.length <= 1) return true;
  if (parts.length === 2) {
    var folder = parts[0];
    return filename.replace(/\.(js|json|cstz|zip)$/i, '').toLowerCase() === folder.toLowerCase();
  }
  return false;
}

function fmDeduplicateMindmapFiles(files) {
  var sessionMap = new Map();
  (Array.isArray(files) ? files : []).forEach(function(f) {
    if (!f || !fmIsMindmapSessionFile(f)) return;
    var rel = String(f.relativePath || f.filename || '').replace(/\\/g, '/');
    var isArchived = rel.split('/').indexOf('archived') !== -1;
    var baseName = (f.filename || rel.split('/').pop() || '').replace(/\.(js|json|cstz|zip)$/i, '').toLowerCase();
    var key = (isArchived ? 'archived:' : 'active:') + baseName;
    var isArchiveFile = rel.endsWith('.cstz') || rel.endsWith('.zip');
    var existing = sessionMap.get(key);
    if (!existing) {
      sessionMap.set(key, f);
    } else {
      var existingRel = String(existing.relativePath || existing.filename || '').replace(/\\/g, '/');
      var existingIsArchive = existingRel.endsWith('.cstz') || existingRel.endsWith('.zip');
      if (isArchiveFile && !existingIsArchive) {
        sessionMap.set(key, f);
      } else if (!isArchiveFile && existingIsArchive) {
        // keep existing .cstz
      } else if ((f.mtimeMs || f.savedAt || 0) > (existing.mtimeMs || existing.savedAt || 0)) {
        sessionMap.set(key, f);
      }
    }
  });
  return Array.from(sessionMap.values());
}

function fmIsTemplateMindmapFile(fileObj) {
  if (!fileObj) return false;
  var target = fileObj.target || 'mindmaps';
  var rel = fileObj.relativePath || fileObj.filename || '';
  var isMindmap = target === 'mindmaps' || (target === 'user' && rel.startsWith('mindmaps/'));
  if (!isMindmap) return false;
  return rfIsTemplateType(rfSessionTypeCache.get(rfSessionCacheKey(fileObj)));
}

async function fmPrimeBrowseSessionTypes(files) {
  if (!(window.Desktop && Desktop.isElectron())) return;
  var list = (Array.isArray(files) ? files : []).filter(function(f) {
    if (!f || f.isDirectory) return false;
    var target = f.target || browseTarget || 'mindmaps';
    var rel = f.relativePath || f.filename || '';
    var isMindmap = target === 'mindmaps' || (target === 'user' && rel.startsWith('mindmaps/'));
    if (!isMindmap) return false;
    return /\.(js|json|cstz|zip)$/i.test(String(f.filename || ''));
  });
  if (!list.length) return;

  var missing = [];
  list.forEach(function(f) {
    var key = rfSessionCacheKey(f);
    var st = f.sessionType || f._type;
    if (st !== undefined) {
      rfSessionTypeCache.set(key, st || '');
    } else if (!rfSessionTypeCache.has(key)) {
      missing.push(f);
    }
  });

  if (missing.length > 0) {
    var BATCH = 8;
    for (var i = 0; i < missing.length; i += BATCH) {
      var batch = missing.slice(i, i + BATCH);
      await Promise.all(batch.map(async function(f) {
        var target = f.target || browseTarget || 'mindmaps';
        var key = rfSessionCacheKey(f);
        var rel = f.relativePath || f.filename || '';
        var isArchive = rel.endsWith('.cstz') || rel.endsWith('.zip');
        if (isArchive && typeof Desktop.inspectBoardArchive === 'function') {
          try {
            var insp = await Desktop.inspectBoardArchive(target, rel);
            rfSessionTypeCache.set(key, (insp && insp.manifest && insp.manifest._type) || 'constellation');
            return;
          } catch(e) {
            rfSessionTypeCache.set(key, 'constellation');
            return;
          }
        }
        if (typeof Desktop.readByPath === 'function') {
          try {
            var result = await Desktop.readByPath(target, rel);
            var raw = result && result.content ? result.content : '';
            rfSessionTypeCache.set(key, rfExtractSessionType(raw));
          } catch (e) {
            rfSessionTypeCache.set(key, '');
          }
        }
      }));
    }
  }
}

function rfExtractSearchText(raw) {
  var parts = [];
  var re = /(?:baseWord|text|label|title)"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
  var m;
  while ((m = re.exec(raw)) !== null) {
    if (m[1]) parts.push(m[1].replace(/\\n/g, ' ').replace(/\\r/g, ' ').replace(/\\"/g, '"'));
  }
  return parts.join(' ').toLowerCase();
}

function rfGetSnippet(text, query) {
  if (!text || !query) return '';
  var idx = text.indexOf(query);
  if (idx === -1) return '';
  var ctx = 60;
  var start = Math.max(0, idx - ctx);
  var end   = Math.min(text.length, idx + query.length + ctx);
  var snippet = text.slice(start, end).trim();
  if (start > 0) snippet = '[…] ' + snippet;
  if (end < text.length) snippet += ' […]';
  return snippet;
}

async function rfRunContentSearch() {
  rfSearchTimer = null;
  var search = document.getElementById('rfSearch').value.trim().toLowerCase();
  if (!search) { rfRender(); return; }
  if (!(window.Desktop && Desktop.isElectron() && typeof Desktop.readByPath === 'function')) {
    rfRender(); return;
  }
  var gen = ++rfSearchGeneration;
  var toRead = rfSessions.concat(rfArchivedSessions).filter(function(f) {
    return !rfContentCache.has(normPath(f.relativePath || f.filename));
  });
  if (toRead.length > 0) {
    var BATCH = 8;
    for (var i = 0; i < toRead.length; i += BATCH) {
      if (rfSearchGeneration !== gen) return;
      var batch = toRead.slice(i, i + BATCH);
      await Promise.all(batch.map(async function(f) {
        var key = normPath(f.relativePath || f.filename);
        try {
          var result = await Desktop.readByPath(f.target, f.relativePath || f.filename);
          rfContentCache.set(key, rfExtractSearchText(result && result.content ? result.content : ''));
        } catch(e) {
          rfContentCache.set(key, '');
        }
      }));
      if (rfSearchGeneration !== gen) return;
      rfRender();
    }
  }
  if (rfSearchGeneration === gen) rfRender();
}

function rfSortFn(order) {
  if (order === 'date-asc')  return function(a,b){ return fileDateMs(a) - fileDateMs(b); };
  if (order === 'name-asc')  return function(a,b){ return prettyName(a.filename).localeCompare(prettyName(b.filename)); };
  if (order === 'name-desc') return function(a,b){ return prettyName(b.filename).localeCompare(prettyName(a.filename)); };
  if (order === 'size-desc') return function(a,b){ return (b.size||0) - (a.size||0); };
  return function(a,b){ return fileDateMs(b) - fileDateMs(a); };
}

function rfRender() {
  var filter = document.getElementById('rfTypeFilter').value;
  var search = document.getElementById('rfSearch').value.trim().toLowerCase();
  var sort   = document.getElementById('rfSortOrder').value;
  var DOC_KEYS = ['pdf','image','sound','book'];
  var isDocFilter     = DOC_KEYS.indexOf(filter) !== -1;
  var isSessFilter    = filter === 'mindmaps';
  var isEditorFilter  = filter === 'doceditor';

  var uncachedCount = 0;
  if (search) {
    rfSessions.concat(rfArchivedSessions).forEach(function(f) {
      if (!rfContentCache.has(normPath(f.relativePath || f.filename))) uncachedCount++;
    });
  }

  function rfMatchesSearch(f, isSession) {
    if (!search) return true;
    var fn = (f.filename || '').toLowerCase();
    if (fn.indexOf(search) !== -1) return true;
    if (isSession && prettyName(f.filename).toLowerCase().indexOf(search) !== -1) return true;
    var rel = normPath(f.relativePath || f.filename || '').toLowerCase();
    if (rel.indexOf(search) !== -1) return true;
    if (isSession) {
      var key = normPath(f.relativePath || f.filename);
      if (rfContentCache.has(key) && rfContentCache.get(key).indexOf(search) !== -1) return true;
    }
    return false;
  }

  var filteredS = (isDocFilter || isEditorFilter) ? [] : rfSessions.filter(function(f) {
    if (!showVersions && isVersionFile(f)) return false;
    if (isSessFilter && f.target !== filter) return false;
    return rfMatchesSearch(f, true);
  }).map(function(f) {
    var snippet = '';
    if (search) {
      var cached = rfContentCache.get(normPath(f.relativePath || f.filename));
      if (cached) snippet = rfGetSnippet(cached, search);
    }
    return { file: f, snippet: snippet };
  });
  filteredS.sort(function(a, b) { return rfSortFn(sort)(a.file, b.file); });

  var filteredD = (isSessFilter || isEditorFilter) ? [] : rfDocs.filter(function(f) {
    if (isDocFilter && docTypeKey(f.filename) !== filter) return false;
    return rfMatchesSearch(f, false);
  });
  filteredD.sort(rfSortFn(sort));

  var filteredE = (isSessFilter || isDocFilter) ? [] : rfEditorDocs.filter(function(f) {
    return rfMatchesSearch(f, false);
  });
  filteredE.sort(rfSortFn(sort));

  var filteredAS = !search ? [] : ((isDocFilter || isEditorFilter) ? [] : rfArchivedSessions.filter(function(f) {
    if (!showVersions && isVersionFile(f)) return false;
    if (isSessFilter && f.target !== filter) return false;
    return rfMatchesSearch(f, true);
  }).map(function(f) {
    var snippet = '';
    var cached = rfContentCache.get(normPath(f.relativePath || f.filename));
    if (cached) snippet = rfGetSnippet(cached, search);
    return { file: f, snippet: snippet };
  }));
  filteredAS.sort(function(a, b) { return rfSortFn(sort)(a.file, b.file); });

  var filteredAD = !search ? [] : ((isSessFilter || isEditorFilter) ? [] : rfArchivedDocs.filter(function(f) {
    if (isDocFilter && docTypeKey(f.filename) !== filter) return false;
    return rfMatchesSearch(f, false);
  }));
  filteredAD.sort(rfSortFn(sort));

  var filteredAE = !search ? [] : ((isSessFilter || isDocFilter) ? [] : rfArchivedEditorDocs.filter(function(f) {
    return rfMatchesSearch(f, false);
  }));
  filteredAE.sort(rfSortFn(sort));

  var rfList = document.getElementById('rfList');
  if (!filteredS.length && !filteredD.length && !filteredE.length && !filteredAS.length && !filteredAD.length && !filteredAE.length) {
    var noFilesIcon = uncachedCount > 0 ? '🔍' : '📭';
    var noFilesMsg  = uncachedCount > 0
      ? tt('rfNoFiles','No files found yet') + ' · ' + tt('rfSearchingContent','scanning content…')
      : tt('rfNoFiles','No files found.');
    rfList.innerHTML = '<div class="state-msg"><span class="state-icon">' + noFilesIcon + '</span>' + escHtml(noFilesMsg) + '</div>';
  } else {
    rfList.innerHTML = '';
    filteredS.forEach(function(item) { rfList.appendChild(makeRfRow(item.file, true, item.snippet, false)); });
  }

  var rfEH = document.getElementById('rfEditorDocsHeading');
  var rfEL = document.getElementById('rfEditorDocsList');
  rfEH.style.display = filteredE.length ? '' : 'none';
  rfEL.innerHTML = '';
  filteredE.forEach(function(f) { rfEL.appendChild(makeEditorDocRow(f, false)); });

  var rfDH = document.getElementById('rfDocsHeading');
  var rfDL = document.getElementById('rfDocsList');
  rfDH.style.display = filteredD.length ? '' : 'none';
  rfDL.innerHTML = '';
  filteredD.forEach(function(f) { rfDL.appendChild(makeRfRow(f, false, '', false)); });

  var rfAH = document.getElementById('rfArchivedHeading');
  var rfAL = document.getElementById('rfArchivedList');
  var archivedCount = filteredAS.length + filteredAD.length + filteredAE.length;
  rfAH.style.display = archivedCount ? '' : 'none';
  rfAL.innerHTML = '';
  filteredAS.forEach(function(item) { rfAL.appendChild(makeRfRow(item.file, true, item.snippet, true)); });
  filteredAD.forEach(function(f) { rfAL.appendChild(makeRfRow(f, false, '', true)); });
  filteredAE.forEach(function(f) { rfAL.appendChild(makeEditorDocRow(f, true)); });

  var total = filteredS.length + filteredD.length + filteredE.length + archivedCount;
  var countText = total + ' ' + tt(total === 1 ? 'rfFile' : 'rfFiles', total === 1 ? 'file' : 'files');
  if (search && uncachedCount > 0) countText += ' · scanning…';
  document.getElementById('rfCount').textContent = countText;
}

async function loadRecent() {
  var rfList = document.getElementById('rfList');
  if (!window.Desktop || !Desktop.isElectron()) {
    rfList.innerHTML = '<div class="state-msg"><span class="state-icon">⚠</span>' + escHtml(tt('rfElectronRequiredPage','Requires the Electron desktop app.')) + '</div>';
    return;
  }

  var results = await Promise.all([
    Desktop.listByPath('mindmaps', '', { extensions:['.js','.json','.cstz','.zip'], recursive:true }).catch(function(e){ console.warn('loadRecent sessions:', e); return null; }),
    Desktop.listByPath('user', 'custom-data', { extensions:DOC_EXTS, recursive:true }).catch(function(e){ console.warn('loadRecent docs:', e); return null; }),
    Desktop.listByPath('docEditorDocs', '', { extensions: ['.md', '.html'], recursive: true }).catch(function(e){ console.warn('loadRecent editorDocs:', e); return null; })
  ]);

  var r = results[0];
  var d = results[1];
  var e = results[2];

  if (r && r.ok && Array.isArray(r.files)) {
    var validFiles = fmDeduplicateMindmapFiles(r.files);
    var allSessions = validFiles.map(function(f) { return Object.assign({}, f, { target:'mindmaps' }); });
    allSessions = await rfFilterOutTemplateSessions(allSessions);
    rfSessions = allSessions.filter(function(f) {
      var rel = normPath(f.relativePath || f.filename || '');
      return rel.split('/').indexOf('archived') === -1;
    });
    rfArchivedSessions = allSessions.filter(function(f) {
      var rel = normPath(f.relativePath || f.filename || '');
      return rel.split('/').indexOf('archived') !== -1;
    });
  }

  if (d && d.ok && Array.isArray(d.files)) {
    rfDocs = d.files.filter(function(f) {
      var rel = normPath(f.relativePath || f.filename || '');
      return rel.split('/').indexOf('archived') === -1;
    });
    rfArchivedDocs = d.files.filter(function(f) {
      var rel = normPath(f.relativePath || f.filename || '');
      return rel.split('/').indexOf('archived') !== -1;
    });
  }

  if (e && e.ok && Array.isArray(e.files)) {
    var allEditorDocs = e.files.filter(function(f) {
      var rel = normPath(f.relativePath || f.filename || '');
      return !rel.startsWith('history/');
    }).map(function(f) { return Object.assign({}, f, { target: 'docEditorDocs' }); });
    rfEditorDocs = allEditorDocs.filter(function(f) {
      return normPath(f.relativePath || f.filename || '').split('/').indexOf('archived') === -1;
    });
    rfArchivedEditorDocs = allEditorDocs.filter(function(f) {
      return normPath(f.relativePath || f.filename || '').split('/').indexOf('archived') !== -1;
    });
  }

  rfRender();
}

  var rel = normPath(relPath || '');

}

  var rel = normPath(relPath || '');
  if (!rel) return '';

  return idx === -1 ? '' : rel.slice(0, idx);
