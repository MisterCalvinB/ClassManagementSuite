<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Companion — Timings & Plan</title>
  <link rel="stylesheet" href="../modules/lexend/lexend.css">
  <script src="../electron-bridge.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/dialogs.js"></script>
  <style>
    :root {
      --comp-bg: #f8fafc;
      --comp-dark: #0f172a;
      --comp-yellow: #fde047;
      --comp-yellow-dark: #eab308;
      --comp-green: #86efac;
      --comp-blue: #93c5fd;
      --comp-red: #fca5a5;
      --comp-purple: #d8b4fe;
      --comp-gray-light: #f1f5f9;
      --comp-gray-mid: #cbd5e1;
      --comp-gray-dark: #64748b;
      --neo-border: 2px solid var(--comp-dark);
      --neo-shadow: 2px 2px 0px var(--comp-dark);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lexend', sans-serif;
      background: var(--comp-bg);
      color: var(--comp-dark);
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header Bar ────────────────────────────────────────────────────────── */
    .comp-header {
      background: #ffffff;
      border-bottom: var(--neo-border);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 2px 0 rgba(0,0,0,0.06);
    }

    .comp-header-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .comp-plan-title {
      font-size: 0.95rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--comp-dark);
    }

    .comp-plan-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--comp-gray-dark);
      margin-top: 1px;
    }

    .comp-badge {
      background: var(--comp-gray-light);
      border: 1px solid var(--comp-dark);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .comp-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .comp-icon-btn {
      background: #ffffff;
      border: var(--neo-border);
      border-radius: 4px;
      box-shadow: var(--neo-shadow);
      padding: 3px 6px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .comp-icon-btn:hover {
      background: var(--comp-gray-light);
      transform: translate(-1px, -1px);
    }

    .comp-icon-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--comp-dark);
    }

    .comp-icon-btn.active {
      background: var(--comp-yellow);
    }

    /* ── Active Phase Runner & Timer ───────────────────────────────────────── */
    .comp-runner-panel {
      background: #ffffff;
      border-bottom: var(--neo-border);
      padding: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 0 rgba(0,0,0,0.04);
    }

    .comp-runner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .comp-phase-step-badge {
      font-size: 0.72rem;
      font-weight: 900;
      background: var(--comp-dark);
      color: #ffffff;
      border-radius: 4px;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .comp-active-phase-name {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--comp-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .comp-timer-clock {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.6rem;
      font-weight: 900;
      text-align: center;
      padding: 4px 0;
      letter-spacing: 1px;
      color: var(--comp-dark);
      transition: color 0.15s ease;
    }

    .comp-timer-clock.warning {
      color: #d97706;
    }

    .comp-timer-clock.overtime {
      color: #dc2626;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.6; }
    }

    .comp-runner-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .comp-ctrl-btn {
      background: #ffffff;
      border: var(--neo-border);
      border-radius: 4px;
      box-shadow: var(--neo-shadow);
      padding: 4px 12px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .comp-ctrl-btn.primary {
      background: var(--comp-yellow);
    }

    .comp-ctrl-btn.success {
      background: var(--comp-green);
    }

    .comp-ctrl-btn.danger {
      background: var(--comp-red);
    }

    .comp-ctrl-btn:hover {
      transform: translate(-1px, -1px);
    }

    .comp-ctrl-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--comp-dark);
    }

    .comp-progress-bar-wrap {
      height: 6px;
      background: var(--comp-gray-mid);
      border: 1px solid var(--comp-dark);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .comp-progress-bar-fill {
      height: 100%;
      background: var(--comp-yellow-dark);
      width: 0%;
      transition: width 0.3s ease;
    }

    .comp-progress-bar-fill.overtime {
      background: #dc2626;
    }

    /* ── Timeline & Phases List ────────────────────────────────────────────── */
    .comp-timeline-header {
      padding: 8px 10px 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--comp-gray-dark);
      flex-shrink: 0;
    }

    .comp-phases-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comp-phase-card {
      background: #ffffff;
      border: var(--neo-border);
      border-radius: 4px;
      box-shadow: 1px 1px 0px var(--comp-dark);
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
    }

    .comp-phase-card:hover {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px var(--comp-dark);
    }

    .comp-phase-card.active {
      background: #fefce8;
      border: 2px solid var(--comp-yellow-dark);
      box-shadow: 2px 2px 0px var(--comp-dark);
    }

    .comp-phase-card.completed {
      opacity: 0.7;
      background: #f8fafc;
    }

    .comp-phase-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .comp-phase-time-pill {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.72rem;
      font-weight: 900;
      background: var(--comp-gray-light);
      border: 1px solid var(--comp-dark);
      border-radius: 4px;
      padding: 1px 5px;
      white-space: nowrap;
    }

    .comp-phase-card.active .comp-phase-time-pill {
      background: var(--comp-yellow);
    }

    .comp-phase-title-text {
      font-weight: 800;
      font-size: 0.82rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .comp-phase-duration-text {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--comp-gray-dark);
      white-space: nowrap;
    }

    .comp-phase-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .comp-phase-pill {
      font-size: 0.65rem;
      font-weight: 800;
      border: 1px solid var(--comp-dark);
      border-radius: 3px;
      padding: 1px 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .comp-phase-pill img {
      width: 10px;
      height: 10px;
    }

    .comp-phase-details {
      display: none;
      font-size: 0.74rem;
      color: #334155;
      padding-top: 4px;
      border-top: 1px dashed var(--comp-gray-mid);
      margin-top: 2px;
      line-height: 1.35;
    }

    .comp-phase-card.expanded .comp-phase-details {
      display: block;
    }

    .comp-detail-row {
      margin-top: 2px;
    }

    .comp-detail-label {
      font-weight: 800;
      color: var(--comp-dark);
    }

    .comp-expand-toggle {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--comp-gray-dark);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      align-self: flex-start;
      padding: 0;
    }

    /* ── Bottom Status Bar ─────────────────────────────────────────────────── */
    .comp-footer {
      background: #ffffff;
      border-top: var(--neo-border);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--comp-gray-dark);
      flex-shrink: 0;
    }

    .comp-empty-state {
      text-align: center;
      color: var(--comp-gray-dark);
      padding: 40px 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- ── 1. Header Bar ─────────────────────────────────────────────────────── -->
  <div class="comp-header">
    <div class="comp-header-title-wrap">
      <div class="comp-plan-title" id="planTitleDisplay">Untitled Lesson</div>
      <div class="comp-plan-meta">
        <span class="comp-badge" id="planClassBadge">No Class</span>
        <span id="planTotalDurationBadge">60 min</span>
      </div>
    </div>
    <div class="comp-header-actions">
      <button type="button" class="comp-icon-btn active" id="pinBtn" onclick="toggleAlwaysOnTop()" title="Always on Top">
        <span>📌</span>
      </button>
      <button type="button" class="comp-icon-btn" onclick="syncFromStorage()" title="Sync / Refresh">
        <span>🔄</span>
      </button>
      <button type="button" class="comp-icon-btn" onclick="runInClassManagement()" title="Run in Class Management">
        <span>CMS</span>
      </button>
    </div>
  </div>

  <!-- ── 2. Active Phase Runner & Countdown ───────────────────────────────── -->
  <div class="comp-runner-panel">
    <div class="comp-runner-top">
      <span class="comp-phase-step-badge" id="currentPhaseBadge">Phase 1 / 1</span>
      <span class="comp-active-phase-name" id="currentPhaseName">Introduction</span>
    </div>

    <div class="comp-timer-clock" id="timerDisplay">10:00</div>

    <div class="comp-runner-controls">
      <button type="button" class="comp-ctrl-btn" onclick="prevPhase()" title="Previous Phase">⏮</button>
      <button type="button" class="comp-ctrl-btn primary" id="timerPlayBtn" onclick="toggleTimer()">▶ Start</button>
      <button type="button" class="comp-ctrl-btn" onclick="resetCurrentPhaseTimer()" title="Reset Phase Timer">↺</button>
      <button type="button" class="comp-ctrl-btn" onclick="nextPhase()" title="Next Phase">⏭</button>
    </div>

    <div class="comp-progress-bar-wrap">
      <div class="comp-progress-bar-fill" id="phaseProgressFill"></div>
    </div>
  </div>

  <!-- ── 3. Phases Timeline List ───────────────────────────────────────────── -->
  <div class="comp-timeline-header">
    <span data-i18n="lcLessonTimeline">Timeline & Timings</span>
    <span id="timelineStatsText">0 / 60m</span>
  </div>

  <div class="comp-phases-list" id="phasesContainer">
    <!-- Populated by JavaScript -->
  </div>

  <!-- ── 4. Bottom Footer Status Bar ───────────────────────────────────────── -->
  <div class="comp-footer">
    <span id="syncStatusText">Synced with Lesson Creator</span>
    <span id="overallElapsedText">Total Elapsed: 00:00</span>
  </div>

  <script>
    (function () {
      'use strict';

      var planData = {
        title: 'Untitled Lesson',
        class: '',
        duration: 60,
        sections: []
      };

      var activePhaseIndex = 0;
      var timerSecondsRemaining = 0;
      var phaseTotalSeconds = 0;
      var timerRunning = false;
      var timerInterval = null;
      var isAlwaysOnTopState = true;
      var totalElapsedSeconds = 0;
      var totalElapsedInterval = null;

      var broadcastChannel = null;

      // ── Initialization ───────────────────────────────────────────────────
      window.addEventListener('DOMContentLoaded', async function () {
        initI18n();
        initBroadcastChannel();
        await initWindowPinState();
        loadPlanData();
        renderCompanion();
      });

      function initI18n() {
        try {
          if (window.i18n && typeof i18n.init === 'function') {
            i18n.init();
          }
        } catch (_) {}
      }

      async function initWindowPinState() {
        if (window.Desktop && typeof Desktop.isAlwaysOnTop === 'function') {
          try {
            var res = await Desktop.isAlwaysOnTop();
            if (res && res.alwaysOnTop !== undefined) {
              isAlwaysOnTopState = !!res.alwaysOnTop;
              updatePinButtonUI();
            }
          } catch (_) {}
        }
      }

      window.toggleAlwaysOnTop = async function () {
        isAlwaysOnTopState = !isAlwaysOnTopState;
        if (window.Desktop && typeof Desktop.setAlwaysOnTop === 'function') {
          try {
            var res = await Desktop.setAlwaysOnTop(isAlwaysOnTopState);
            if (res && res.alwaysOnTop !== undefined) {
              isAlwaysOnTopState = !!res.alwaysOnTop;
            }
          } catch (_) {}
        }
        updatePinButtonUI();
      };

      function updatePinButtonUI() {
        var btn = document.getElementById('pinBtn');
        if (!btn) return;
        if (isAlwaysOnTopState) {
          btn.classList.add('active');
          btn.title = (i18n.t('lcAlwaysOnTop') || 'Always on Top') + ' (Active)';
        } else {
          btn.classList.remove('active');
          btn.title = (i18n.t('lcAlwaysOnTop') || 'Always on Top') + ' (Off)';
        }
      }

      // ── BroadcastChannel Live Sync ───────────────────────────────────────
      function initBroadcastChannel() {
        try {
          if (typeof BroadcastChannel !== 'undefined') {
            broadcastChannel = new BroadcastChannel('cmt-lesson-plan-live');
            broadcastChannel.onmessage = function (e) {
              if (e && e.data) {
                if (e.data.type === 'plan-sync' || e.data.type === 'plan-updated') {
                  if (e.data.plan) {
                    applyPlanUpdate(e.data.plan);
                  } else {
                    syncFromStorage();
                  }
                }
              }
            };
          }
        } catch (_) {}
      }

      window.syncFromStorage = function () {
        loadPlanData();
        renderCompanion();
        var status = document.getElementById('syncStatusText');
        if (status) {
          status.textContent = 'Synced at ' + new Date().toLocaleTimeString();
        }
      };

      function loadPlanData() {
        try {
          var raw = localStorage.getItem('cmt-active-lesson-plan');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              applyPlanUpdate(parsed);
              return;
            }
          }
        } catch (_) {}

        // Fallback demo/empty plan
        if (!planData.sections || planData.sections.length === 0) {
          planData = {
            title: 'Lesson Plan',
            class: '',
            duration: 60,
            sections: [
              { id: 'sec-1', title: 'Warm-up / Review', duration: 10, activityTypeId: 'warmup', interactionTypeId: 'whole_class', objective: 'Activate prior knowledge' },
              { id: 'sec-2', title: 'Direct Instruction', duration: 15, activityTypeId: 'instruction', interactionTypeId: 'whole_class', objective: 'Model key concept' },
              { id: 'sec-3', title: 'Guided Practice', duration: 20, activityTypeId: 'guided', interactionTypeId: 'pairs', objective: 'Collaborative problem solving' },
              { id: 'sec-4', title: 'Synthesis & Exit Ticket', duration: 15, activityTypeId: 'assessment', interactionTypeId: 'individual', objective: 'Formative check' }
            ]
          };
          selectPhase(0);
        }
      }

      function applyPlanUpdate(newPlan) {
        if (!newPlan) return;
        var prevPhaseId = (planData.sections && planData.sections[activePhaseIndex]) ? planData.sections[activePhaseIndex].id : null;
        planData = newPlan;
        planData.sections = Array.isArray(planData.sections) ? planData.sections : [];

        // Preserve current active phase position if possible
        var matchedIdx = -1;
        if (prevPhaseId) {
          matchedIdx = planData.sections.findIndex(function (s) { return s.id === prevPhaseId; });
        }
        if (matchedIdx !== -1) {
          activePhaseIndex = matchedIdx;
        } else if (activePhaseIndex >= planData.sections.length) {
          activePhaseIndex = Math.max(0, planData.sections.length - 1);
          resetCurrentPhaseTimer();
        }

        renderCompanion();
      }

      // ── Rendering ────────────────────────────────────────────────────────
      function renderCompanion() {
        var titleEl = document.getElementById('planTitleDisplay');
        if (titleEl) titleEl.textContent = planData.title || (i18n.t('lcNewPlan') || 'Untitled Lesson');

        var classEl = document.getElementById('planClassBadge');
        if (classEl) {
          if (planData.class) {
            classEl.textContent = planData.class;
            classEl.style.display = 'inline-block';
          } else {
            classEl.style.display = 'none';
          }
        }

        var totalDur = Number(planData.duration) || 60;
        var totalBadge = document.getElementById('planTotalDurationBadge');
        if (totalBadge) totalBadge.textContent = totalDur + ' min';

        renderTimelineList();
        updateActivePhaseDisplay();
      }

      function renderTimelineList() {
        var container = document.getElementById('phasesContainer');
        if (!container) return;

        var sections = planData.sections || [];
        if (sections.length === 0) {
          container.innerHTML = '<div class="comp-empty-state" data-i18n="lcNoPhasesInPlan">' +
            (i18n.t('lcNoPhasesInPlan') || 'No phases in this lesson plan yet.') + '</div>';
          return;
        }

        var cumulativeMinutes = 0;
        var htmlParts = [];

        sections.forEach(function (sec, idx) {
          var dur = Number(sec.duration) || 10;
          var startMin = cumulativeMinutes;
          var endMin = cumulativeMinutes + dur;
          cumulativeMinutes = endMin;

          var isActive = (idx === activePhaseIndex);
          var isCompleted = (idx < activePhaseIndex);

          var timeRange = formatMinutesAsClock(startMin) + ' – ' + formatMinutesAsClock(endMin);

          var pills = [];
          if (sec.activityTypeId) {
            pills.push('<span class="comp-phase-pill" style="background:#fef3c7;">' + escapeHtml(sec.activityTypeId) + '</span>');
          }
          if (sec.interactionTypeId) {
            pills.push('<span class="comp-phase-pill" style="background:#f1f5f9;">' + escapeHtml(sec.interactionTypeId) + '</span>');
          }

          var detailsContent = [];
          if (sec.objective) {
            detailsContent.push('<div class="comp-detail-row"><span class="comp-detail-label">Obj:</span> ' + escapeHtml(sec.objective) + '</div>');
          }
          if (sec.teacherAction) {
            detailsContent.push('<div class="comp-detail-row"><span class="comp-detail-label">Teacher:</span> ' + escapeHtml(sec.teacherAction) + '</div>');
          }
          if (sec.studentAction) {
            detailsContent.push('<div class="comp-detail-row"><span class="comp-detail-label">Students:</span> ' + escapeHtml(sec.studentAction) + '</div>');
          }
          if (sec.resources) {
            detailsContent.push('<div class="comp-detail-row"><span class="comp-detail-label">Resources:</span> ' + escapeHtml(sec.resources) + '</div>');
          }

          var hasDetails = detailsContent.length > 0;

          htmlParts.push(
            '<div class="comp-phase-card' + (isActive ? ' active' : '') + (isCompleted ? ' completed' : '') + '" onclick="selectPhase(' + idx + ')">' +
            '  <div class="comp-phase-card-header">' +
            '    <span class="comp-phase-time-pill">' + timeRange + '</span>' +
            '    <span class="comp-phase-title-text">' + escapeHtml(sec.title || ('Phase ' + (idx + 1))) + '</span>' +
            '    <span class="comp-phase-duration-text">' + dur + 'm</span>' +
            '  </div>' +
            (pills.length > 0 ? ('  <div class="comp-phase-badges">' + pills.join('') + '</div>') : '') +
            (hasDetails ? (
              '  <div class="comp-phase-details">' + detailsContent.join('') + '</div>' +
              '  <button type="button" class="comp-expand-toggle" onclick="event.stopPropagation(); toggleCardExpanded(this)">' + (i18n.t('lcDetailsExpand') || 'Details ▾') + '</button>'
            ) : '') +
            '</div>'
          );
        });

        container.innerHTML = htmlParts.join('');

        var statsEl = document.getElementById('timelineStatsText');
        if (statsEl) {
          statsEl.textContent = cumulativeMinutes + ' / ' + (Number(planData.duration) || cumulativeMinutes) + 'm';
        }
      }

      window.toggleCardExpanded = function (btn) {
        var card = btn.closest('.comp-phase-card');
        if (!card) return;
        card.classList.toggle('expanded');
        var isExp = card.classList.contains('expanded');
        btn.textContent = isExp ? (i18n.t('lcDetailsCollapse') || 'Details ▲') : (i18n.t('lcDetailsExpand') || 'Details ▾');
      };

      // ── Phase Selection & Runner Logic ───────────────────────────────────
      window.selectPhase = function (idx) {
        var sections = planData.sections || [];
        if (idx < 0 || idx >= sections.length) return;
        activePhaseIndex = idx;
        var sec = sections[idx];
        var dur = Number(sec.duration) || 10;
        phaseTotalSeconds = dur * 60;
        timerSecondsRemaining = phaseTotalSeconds;
        pauseTimer();
        updateActivePhaseDisplay();
        renderTimelineList();
      };

      window.nextPhase = function () {
        var sections = planData.sections || [];
        if (activePhaseIndex + 1 < sections.length) {
          selectPhase(activePhaseIndex + 1);
          startTimer();
        } else {
          pauseTimer();
          if (typeof showToast === 'function') {
            showToast(i18n.t('lcLessonComplete') || 'Lesson Complete!');
          }
        }
      };

      window.prevPhase = function () {
        if (activePhaseIndex > 0) {
          selectPhase(activePhaseIndex - 1);
        }
      };

      function updateActivePhaseDisplay() {
        var sections = planData.sections || [];
        var sec = sections[activePhaseIndex];

        var stepBadge = document.getElementById('currentPhaseBadge');
        if (stepBadge) {
          stepBadge.textContent = 'Phase ' + (activePhaseIndex + 1) + ' / ' + Math.max(1, sections.length);
        }

        var nameEl = document.getElementById('currentPhaseName');
        if (nameEl) {
          nameEl.textContent = sec ? (sec.title || ('Phase ' + (activePhaseIndex + 1))) : 'None';
        }

        if (!timerRunning && phaseTotalSeconds === 0 && sec) {
          var dur = Number(sec.duration) || 10;
          phaseTotalSeconds = dur * 60;
          timerSecondsRemaining = phaseTotalSeconds;
        }

        updateClockUI();
      }

      // ── Timer Engine ─────────────────────────────────────────────────────
      window.toggleTimer = function () {
        if (timerRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
      };

      function startTimer() {
        if (timerRunning) return;
        timerRunning = true;
        var btn = document.getElementById('timerPlayBtn');
        if (btn) {
          btn.textContent = '⏸ Pause';
          btn.classList.remove('primary');
          btn.classList.add('danger');
        }

        if (!totalElapsedInterval) {
          totalElapsedInterval = setInterval(function () {
            totalElapsedSeconds++;
            var el = document.getElementById('overallElapsedText');
            if (el) el.textContent = (i18n.t('lcTotalElapsed') || 'Total Elapsed') + ': ' + formatSecondsToMmSs(totalElapsedSeconds);
          }, 1000);
        }

        timerInterval = setInterval(function () {
          timerSecondsRemaining--;
          updateClockUI();

          if (timerSecondsRemaining <= 0) {
            // Overtime warning
            var clockEl = document.getElementById('timerDisplay');
            if (clockEl) clockEl.classList.add('overtime');
          }
        }, 1000);
      }

      function pauseTimer() {
        timerRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        var btn = document.getElementById('timerPlayBtn');
        if (btn) {
          btn.textContent = '▶ Start';
          btn.classList.add('primary');
          btn.classList.remove('danger');
        }
      }

      window.resetCurrentPhaseTimer = function () {
        pauseTimer();
        var sections = planData.sections || [];
        var sec = sections[activePhaseIndex];
        var dur = sec ? (Number(sec.duration) || 10) : 10;
        phaseTotalSeconds = dur * 60;
        timerSecondsRemaining = phaseTotalSeconds;
        updateClockUI();
      };

      function updateClockUI() {
        var clockEl = document.getElementById('timerDisplay');
        if (!clockEl) return;

        var isNegative = timerSecondsRemaining < 0;
        var absSec = Math.abs(timerSecondsRemaining);

        clockEl.textContent = (isNegative ? '+' : '') + formatSecondsToMmSs(absSec);

        clockEl.classList.remove('warning', 'overtime');
        if (isNegative) {
          clockEl.classList.add('overtime');
        } else if (timerSecondsRemaining <= 60 && timerSecondsRemaining > 0) {
          clockEl.classList.add('warning');
        }

        // Progress bar
        var fill = document.getElementById('phaseProgressFill');
        if (fill && phaseTotalSeconds > 0) {
          var pct = Math.min(100, Math.max(0, ((phaseTotalSeconds - timerSecondsRemaining) / phaseTotalSeconds) * 100));
          fill.style.width = pct + '%';
          if (isNegative) {
            fill.classList.add('overtime');
          } else {
            fill.classList.remove('overtime');
          }
        }
      }

      // ── Actions ──────────────────────────────────────────────────────────
      window.runInClassManagement = function () {
        try {
          if (window.Desktop && typeof Desktop.openHtml === 'function') {
            Desktop.openHtml({ pageFile: 'class-management.html' });
          } else {
            window.open('class-management.html', '_blank');
          }
        } catch (_) {}
      };

      // ── Utilities ────────────────────────────────────────────────────────
      function formatMinutesAsClock(minutes) {
        var h = Math.floor(minutes / 60);
        var m = minutes % 60;
        return (h > 0 ? h + ':' : '') + (m < 10 && h > 0 ? '0' : '') + m + ':00';
      }

      function formatSecondsToMmSs(totalSec) {
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

    })();
  </script>
</body>
</html>
