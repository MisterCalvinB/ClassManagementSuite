      btn.className = 'om-action-primary save';
      btn.innerHTML = '<img src="../assets/icons/save.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnSaveGrades') + '</span>';
      return;
    }

    if (phase === 'idle') {
      btn.innerHTML = '<img src="../assets/icons/play.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + ((currentIdx < 0) ? t('omBtnBegin') : t('omBtnNextStudent')) + '</span>';
      skipBtn.classList.remove('hidden');
      skipBtn.innerHTML = '<img src="../assets/icons/rewind.svg" class="btn-icon om-btn-icon-mr" style="transform:scaleX(-1);" alt="" /><span>' + t('omBtnSkip') + '</span>';
      return;
    }

    if (phase === 'prep') {
      btn.className = 'om-action-primary exam';
      btn.innerHTML = '<img src="../assets/icons/mic.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnStartExam') + '</span>';
      skipBtn.classList.remove('hidden');
      skipBtn.innerHTML = '<img src="../assets/icons/rewind.svg" class="btn-icon om-btn-icon-mr" style="transform:scaleX(-1);" alt="" /><span>' + t('omBtnSkip') + '</span>';
      pauseBtn.classList.remove('hidden');
      pauseBtn.innerHTML = paused
        ? '<img src="../assets/icons/play.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnResume') + '</span>'
        : '<img src="../assets/icons/pause.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnPause') + '</span>';
      return;
    }

    if (phase === 'exam') {
      btn.className = 'om-action-primary exam';
      btn.innerHTML = '<img src="../assets/icons/check.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnFinishExam') + '</span>';
      skipBtn.classList.remove('hidden');
      skipBtn.innerHTML = '<img src="../assets/icons/rewind.svg" class="btn-icon om-btn-icon-mr" style="transform:scaleX(-1);" alt="" /><span>' + t('omBtnSkip') + '</span>';
      pauseBtn.classList.remove('hidden');
      pauseBtn.innerHTML = paused
        ? '<img src="../assets/icons/play.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnResume') + '</span>'
        : '<img src="../assets/icons/pause.svg" class="btn-icon om-btn-icon-mr" alt="" /><span>' + t('omBtnPause') + '</span>';
      return;
    }
  }

  function updateSaveBtn() {
    const saveBtn = document.getElementById('om-save-gs-btn');
    const openBtn = document.getElementById('om-open-gs-btn');
    const hasDone = students.some(s => s.status === 'done');
    if (saveBtn) {
      saveBtn.classList.toggle('hidden', !hasDone);
    }
    if (openBtn) {
      openBtn.classList.toggle('hidden', !linkedGradeTest);
    }
    updateResetBtn();
  }

  function updateResetBtn() {
    const resetBtn = document.getElementById('om-reset-btn');
    if (resetBtn) {
      const hasSession = !!schedule || sessionStarted || (Array.isArray(students) && students.length > 0);
      resetBtn.classList.toggle('hidden', !hasSession);
    }
  }

  async function confirmResetSession() {
    const hasMarks = students.some(s => s.status === 'done' || s.grade !== null || Object.keys(s.criteriaScores || {}).length > 0 || (s.notes && s.notes.trim()));
    const msg = hasMarks ? t('omConfirmResetWithGrades') : t('omConfirmReset');
    let confirmed = false;
    if (typeof showConfirm === 'function') {
      confirmed = await showConfirm(msg);
    } else {
      confirmed = confirm(msg);
    }
    if (!confirmed) return;
    resetSession();
  }

  function resetSession() {
    stopTimer();
    schedule = null;
    sessionStarted = false;
    phase = 'idle';
    currentIdx = -1;
    reviewingIdx = -1;
    students = [];
    sessionCriteria = [];
    oralSessionId = generateUuid();
    linkedGradeTest = null;
    activeCriteria = [];

    try {
      localStorage.removeItem(SESSION_STORAGE_KEY);
    } catch (e) {}

    updateHeader();
    showSetup();
    updateSaveBtn();
    updateResetBtn();

    if (_presChannel) {
      _presChannel.postMessage({
        phase: 'idle',
        studentName: '—',
        elapsed: 0,
        remaining: 0,
        totalTime: 0,
        warning: false,
        reset: true
      });
    }

    showNotice(t('omSessionResetDone') || 'Session reset successfully.');
  }

  function openInGradeSheet() {
    if (window.Desktop && typeof Desktop.openTool === 'function') {
      Desktop.openTool('grade-sheet.html');
    } else {
      window.location.href = 'grade-sheet.html';
    }
  }

  function handleActionBtn() {
    // Review mode: close review and return
    if (reviewingIdx >= 0) {
      closeReview();
      return;
    }
    if (phase === 'done-all') {
      saveGrades();
      return;
    }
    if (phase === 'idle') {
      advanceToNext();
      return;
    }
    if (phase === 'prep') {
      startExam();
      return;
    }
    if (phase === 'exam') {
      finishCurrentExam(false);
      renderSidebar();
      updateActionBar();
      return;
    }
  }

  // ── Presenter broadcast ──────────────────────────────────
  function broadcastState(elapsed, remaining, isWarning) {
    if (!_presChannel) return;
    const s = currentIdx >= 0 ? students[currentIdx] : null;
    const state = {
      phase,
      studentName: s ? fmtStudentName(s.name) : '—',
      elapsed:     elapsed   != null ? Math.round(elapsed)   : 0,
      remaining:   remaining != null ? Math.round(remaining) : 0,
      totalTime:   phaseDuration,
      warning:     !!isWarning
    };
    _presChannel.postMessage(state);
  }

  async function togglePresenter() {
    if (!window.Desktop || !Desktop.isElectron()) return;
    const isOpen = await Desktop.isOralPresenterOpen();
    if (isOpen) {
      Desktop.oralPresenterCommand('close');

  function matchesStudent(s, cs) {
    if (!s || !cs) return false;
    if (s.studentId && cs.id && s.studentId === cs.id) return true;
    if (s.id && cs.id && s.id === cs.id) return true;

    const sName = normalizeStudentName(s.name || '');
    if (!sName) return false;

    const fn = normalizeStudentName(cs.firstName || '');
    const ln = normalizeStudentName(cs.lastName || '');
    const custom = normalizeStudentName(cs.customName || '');

    const name1 = (fn + ' ' + ln).trim();
    const name2 = (ln + ' ' + fn).trim();
    if (sName === name1 || sName === name2) return true;
    if (custom && (sName === custom || sName.includes(custom) || custom.includes(sName))) return true;

    // Token comparison (set of words)
    const sTokens = sName.split(/\s+/).filter(Boolean);
    const csTokens = `${fn} ${ln} ${custom}`.split(/\s+/).filter(Boolean);
    if (sTokens.length > 0 && csTokens.length > 0) {
      const sSet = new Set(sTokens);
      const matches = csTokens.filter(t => sSet.has(t));
      if (matches.length >= 2 || (sTokens.length === 1 && csTokens.includes(sTokens[0]))) {
        return true;
      }
    }

    if (name1 && (sName.includes(name1) || name1.includes(sName))) return true;
    if (name2 && (sName.includes(name2) || name2.includes(sName))) return true;
    if (ln && sTokens.includes(ln)) return true;

    return false;
  }

  // ── Save grades ──────────────────────────────────────────
  async function saveGrades() {
    const doneStudents = students.filter(s => s.status === 'done');
    if (!doneStudents.length) {
      showNotice(t('omSaveNoGrades'), true);
      return;
    }
    if (!window.Desktop || !Desktop.isElectron()) {
      showNotice('Electron required.', true);
      return;
    }

    showNotice(t('saving') || 'Saving…', false);
    const btn = document.getElementById('om-action-btn');
    btn.disabled = true;

    try {
      const now = Date.now();
      const sem = schedule?.semester || 'sem1';

      // Find matching grade-sheet class
      let classId        = null;
      let classStudents  = [];
      let classMeta      = null;
      let isNewClass     = false;
      let nextTestIndex  = 0;

      const listRes = await Desktop.listByPath('grades', '', { recursive: true, extensions: ['.js'] });
      if (listRes?.ok && Array.isArray(listRes.files)) {
        const classFiles = listRes.files.filter(f => f.filename === '_class.js');
        for (const cf of classFiles) {
          const r = await Desktop.readByPath('grades', cf.relativePath);
          if (!r?.content) continue;
          const data = parseJsVar(r.content, 'GRADE_CLASS');
          if (data?.groupId === schedule?.group || (schedule?.group && data?.className === getGroupName(schedule.group))) {
            classId       = data.classId;
            classStudents = data.students || [];
            classMeta     = data;
            break;
          }
        }
      }

      if (!classId) {
        // Also check if class exists in localStorage state
        try {
          const rawState = localStorage.getItem('cms_grade_sheet_state');
          if (rawState) {
            const parsedState = JSON.parse(rawState);
            if (parsedState && Array.isArray(parsedState.classes)) {
              const foundClass = parsedState.classes.find(c =>
                (schedule?.group && c.groupId === schedule.group) ||
                (schedule?.group && c.name && c.name.toLowerCase() === getGroupName(schedule.group).toLowerCase())
              );
              if (foundClass) {
                classId = foundClass.id;
                classStudents = foundClass.students || [];
                classMeta = {
                  _savedAt: now,
                  classId: foundClass.id,
                  groupId: foundClass.groupId || schedule?.group || '',
                  className: foundClass.name || getGroupName(schedule?.group) || 'Oral',
                  classYear: foundClass.year || classGroupsMeta[schedule?.group]?.year || '',
                  classSemester: sem,
                  classLevel: foundClass.level || '',
                  classCreatedAt: foundClass.createdAt || new Date().toISOString(),
                  testCounts: foundClass.testCounts || { sem1: 0, sem2: 0 },
                  students: classStudents
                };
              }
            }
          }
        } catch (e) {}
      }

      if (!classId) {
        // Create new class
        isNewClass    = true;
        classId       = generateUuid();
        classStudents = buildClassStudents(schedule?.group);
        classMeta = {
          _savedAt:        now,
          classId,
          groupId:         schedule?.group || '',
          className:       getGroupName(schedule?.group) || schedule?.title || 'Oral',
          classYear:       classGroupsMeta[schedule?.group]?.year || '',
          classSemester:   sem,
          classLevel:      '',
          classCreatedAt:  new Date().toISOString(),
          testCounts:      { sem1: 0, sem2: 0 },
          students:        classStudents
        };
      }

      // Find next empty test slot
      const semKey = sem.startsWith('sem') ? sem : 'sem1';
      const existingLinked = linkedGradeTest
        && linkedGradeTest.classId === classId
        && linkedGradeTest.semester === semKey
        && Number.isInteger(linkedGradeTest.testIndex)
        && linkedGradeTest.testIndex >= 0
        && linkedGradeTest.testIndex < 8
        ? linkedGradeTest
        : null;

      if (existingLinked) {
        nextTestIndex = existingLinked.testIndex;
      } else {
        for (let i = 0; i < 8; i++) {
          const label = `${semKey}-test-${String(i + 1).padStart(2, '0')}`;
          let r = null;
          try {
            r = await Desktop.readByPath('grades', `${classId}/${label}.js`);
          } catch (e) {
            // Missing file means this slot is available.
            nextTestIndex = i;
            break;
          }
          if (!r?.ok || !r?.content) { nextTestIndex = i; break; }
          if (i === 7) nextTestIndex = 7;
        }
      }

      // Auto-create/register the test slot in class metadata so Grade Sheet exposes it.
      if (!classMeta || typeof classMeta !== 'object') {
        classMeta = {
          _savedAt: now,
          classId,
          groupId: schedule?.group || '',
          className: getGroupName(schedule?.group) || schedule?.title || 'Oral',
          classYear: classGroupsMeta[schedule?.group]?.year || '',
          classSemester: semKey,
          classLevel: '',
          classCreatedAt: new Date().toISOString(),
          testCounts: { sem1: 0, sem2: 0 },
          students: classStudents
        };
      }
      if (!classMeta.testCounts || typeof classMeta.testCounts !== 'object') {
        classMeta.testCounts = { sem1: 0, sem2: 0 };
      }
      if (typeof classMeta.testCounts.sem1 !== 'number') classMeta.testCounts.sem1 = 0;
      if (typeof classMeta.testCounts.sem2 !== 'number') classMeta.testCounts.sem2 = 0;
      classMeta._savedAt = now;
      classMeta.classSemester = semKey;
      classMeta.students = classStudents;
      classMeta.testCounts[semKey] = Math.max(classMeta.testCounts[semKey] || 0, nextTestIndex + 1);

      await Desktop.saveText(
        'grades',
        '_class.js',
        `// _savedAt: ${now}\nwindow.GRADE_CLASS = ${JSON.stringify(classMeta, null, 2)};`,
        classId
      );

      // Build Grade Sheet-compatible criteria config from the criteria used in this oral session.
      const selectedCriteriaNames = (Array.isArray(sessionCriteria) && sessionCriteria.length)
        ? sessionCriteria.slice()
        : criteria
            .map(c => (typeof c === 'string' ? c : (c.name || '')))
            .filter(Boolean);

      const criteriaDefs = selectedCriteriaNames.map((name, i) => {
        const crit = criteriaByName[name] || {};
        const grades = getCritGrades(crit).filter(g => Number.isFinite(Number(g)));
        const minFromCrit = (typeof crit === 'object' && crit.minPoints != null && !isNaN(Number(crit.minPoints))) ? Number(crit.minPoints) : null;
        const maxFromCrit = (typeof crit === 'object' && crit.maxPoints != null && !isNaN(Number(crit.maxPoints))) ? Number(crit.maxPoints) : null;
        const minPoints = minFromCrit != null ? minFromCrit : (grades.length ? Math.min(...grades) : 0);
        const maxPoints = maxFromCrit != null ? maxFromCrit : (grades.length ? Math.max(...grades) : 6);
        return {
          id: `om-crit-${i + 1}`,
          name,
          minPoints: Math.max(0, minPoints),
          maxPoints: Math.max(minPoints, maxPoints),
          pointCoefficient: (typeof crit === 'object' && Number(crit.pointCoefficient)) ? Number(crit.pointCoefficient) : 1,
          showComment: true,
          isBonus: typeof crit === 'object' ? !!crit.isBonus : false
        };
      });

      // Build results matching class students
      const results = classStudents.map(cs => {
        const match = doneStudents.find(s => matchesStudent(s, cs));
        if (!match) return {
          studentId: cs.id,
          name: (cs.firstName + ' ' + cs.lastName).trim() || cs.customName || '',
          score: null,
          testNotes: [],
          criteriaResults: {},
          correctionTime: null,
          gradeOverride: false
        };

        const criteriaResults = {};
        criteriaDefs.forEach(def => {
          const rawPoints = match.criteriaScores ? match.criteriaScores[def.name] : null;
          const rawComment = match.criteriaComments ? match.criteriaComments[def.name] : '';
          if (rawPoints == null && !rawComment) return;
          const pointsNum = rawPoints == null ? null : Number(rawPoints);
          criteriaResults[def.id] = {
            points: Number.isFinite(pointsNum) ? pointsNum : null,
            comment: typeof rawComment === 'string' ? rawComment : ''
          };
        });

        return {
          studentId:       cs.id,
          name:            (cs.firstName + ' ' + cs.lastName).trim() || match.name || '',
          score:           match.grade != null ? Number(match.grade) : null,
          testNotes:       match.notes
            ? [{ label: 'Teacher observations', text: match.notes, checklist: [] }]
            : [],
          criteriaResults,
          correctionTime:  match.actualDuration || null,
          gradeOverride:   false
        };
      });

      // Build testConfig
      const testUuid = existingLinked?.testUuid || generateUuid();
      const testConfig = {
        testUuid,
        source: 'oral-marking',
        sourceOralSessionId: oralSessionId,
        coefficient: 1,
        fixedWeight:  null,
        testName:     schedule?.title || 'Oral Exam',
        testDate:     schedule?.date  || '',
        type:         'oral',
        scope:        '',
        criteria:     criteriaDefs,
        grading:      { mode: 'manual', manualThresholds: {} }
      };

      const testLabel = `${semKey}-test-${String(nextTestIndex + 1).padStart(2, '0')}`;
      const testData  = { _savedAt: now, classId, semester: semKey, testIndex: nextTestIndex, testUuid, testConfig, results };
      await Desktop.saveText('grades', `${testLabel}.js`,
        `// _savedAt: ${now}\nwindow.GRADE_TEST_DATA = ${JSON.stringify(testData, null, 2)};`,
        classId);

      // Save pending import payload in localStorage for dual-synchronization
      try {
        const studentScoresMap = {};
        doneStudents.forEach(s => {
          const sCrit = {};
          criteriaDefs.forEach(def => {
            if (s.criteriaScores && s.criteriaScores[def.name] != null) {
              sCrit[def.id] = { points: Number(s.criteriaScores[def.name]), comment: s.criteriaComments ? s.criteriaComments[def.name] : '' };
            }
          });
          studentScoresMap[s.name] = sCrit;
        });

        const pendingImport = {
          _savedAt: now,
          class: classMeta.className || getGroupName(schedule?.group) || 'Oral',
          className: classMeta.className || getGroupName(schedule?.group) || 'Oral',
          groupId: schedule?.group || '',
          classId,
          semester: semKey,
          test: nextTestIndex + 1,
          testIndex: nextTestIndex,
          testUuid,
          criteria: criteriaDefs,
          studentCriteriaScores: studentScoresMap,
          students: doneStudents.map(s => ({
            name: s.name,
            studentId: s.studentId || null,
            grade: s.grade,
            criteriaResults: studentScoresMap[s.name]
          })),
          grades: Object.fromEntries(doneStudents.filter(s => s.grade != null).map(s => [s.name, s.grade])),
          testConfig,
          results
        };
        localStorage.setItem('CMS_PENDING_GRADE_IMPORT', JSON.stringify(pendingImport));
      } catch (e) { /* ignore */ }

      // Also update in-memory/localStorage grade-sheet state for instant sync
      try {
        const rawState = localStorage.getItem('cms_grade_sheet_state');
        if (rawState) {
          const parsedState = JSON.parse(rawState);
          if (parsedState && Array.isArray(parsedState.classes)) {
            let gsClass = parsedState.classes.find(c => c.id === classId || (schedule?.group && c.groupId === schedule.group) || (classMeta.className && c.name.toLowerCase() === classMeta.className.toLowerCase()));
            if (gsClass) {
              if (!gsClass.testCounts) gsClass.testCounts = { sem1: 0, sem2: 0 };
              gsClass.testCounts[semKey] = Math.max(gsClass.testCounts[semKey] || 0, nextTestIndex + 1);
              if (!gsClass.testConfigs) gsClass.testConfigs = { sem1: [], sem2: [] };
              if (!gsClass.testConfigs[semKey]) gsClass.testConfigs[semKey] = [];
              while (gsClass.testConfigs[semKey].length <= nextTestIndex) {
                gsClass.testConfigs[semKey].push({});
              }
              gsClass.testConfigs[semKey][nextTestIndex] = testConfig;

              results.forEach(res => {
                const st = (res.studentId && gsClass.students.find(s => s.id === res.studentId)) ||
                           gsClass.students.find(s => matchesStudent({ name: res.name }, s));
                if (!st) return;
                const arr = semKey === 'sem1' ? st.sem1Tests : st.sem2Tests;
                arr[nextTestIndex] = res.score;
                if (!st.testNotes) st.testNotes = { sem1: [], sem2: [] };
                if (!st.testNotes[semKey]) st.testNotes[semKey] = [];
                st.testNotes[semKey][nextTestIndex] = res.testNotes || [];
                if (!st.criteriaResults) st.criteriaResults = { sem1: [], sem2: [] };
                if (!st.criteriaResults[semKey]) st.criteriaResults[semKey] = [];
                st.criteriaResults[semKey][nextTestIndex] = res.criteriaResults || {};
              });

              localStorage.setItem('cms_grade_sheet_state', JSON.stringify(parsedState));
            }
          }
        }
      } catch (e) {
        console.warn('Could not sync to localStorage cms_grade_sheet_state:', e);
      }

      linkedGradeTest = {
        classId,
        semester: semKey,
        testIndex: nextTestIndex,
        testUuid
      };
      persistSession();
      updateSaveBtn();

      const msg = isNewClass ? t('omSaveClassNew') : t('omSaveClassFound');
      showNotice(t('omSaved') + ' ' + msg, false);
    } catch (e) {
      showNotice(t('omSaveFailed') + ' ' + e.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  function buildClassStudents(groupId) {
    if (!groupId || !classGroups[groupId]) return students.map((s, i) => ({
      id: generateUuid(), index: i + 1, firstName: fmtStudentName(s.name), lastName: '', comments: ''
    }));
    const rawStudents = classGroups[groupId];
    if (!Array.isArray(rawStudents)) return [];
    return rawStudents.map((entry, i) => {
      if (typeof entry === 'string' && entry.startsWith('st-')) {
        const sr = studentRoster[entry];
        return { id: entry, index: i + 1, firstName: sr?.firstName || entry, lastName: sr?.lastName || '', customName: sr?.customName || '', comments: '' };
      }
      if (typeof entry === 'object') {
        return { id: entry.id || entry.uuid || generateUuid(), index: i + 1, firstName: entry.firstName || '', lastName: entry.lastName || '', customName: entry.customName || '', comments: '' };
      }
      return { id: generateUuid(), index: i + 1, firstName: String(entry), lastName: '', customName: '', comments: '' };
    });
  }

  function getGroupName(groupId) {
    if (!groupId) return '';
    return classGroupsMeta[groupId]?.name || groupId;
  }

  // ── Session persistence ──────────────────────────────────
  function persistSession() {
    if (!schedule) return;
    try {
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
        schedule,
        students,
        sessionCriteria,
        oralSessionId,
        linkedGradeTest
      }));
    } catch (e) { /* ignore */ }
  }

  function tryRestoreSession() {
    try {
      const raw = localStorage.getItem(SESSION_STORAGE_KEY);
      if (!raw) return false;
      const {
        schedule: sc,
        students: sts,
        sessionCriteria: sc2,
        oralSessionId: sid,
        linkedGradeTest: lgt
      } = JSON.parse(raw);
      if (!sc || !Array.isArray(sts)) return false;
      schedule         = sc;
      students         = sts;
      oralSessionId    = typeof sid === 'string' && sid ? sid : generateUuid();
      linkedGradeTest  = (lgt && typeof lgt === 'object') ? lgt : null;
      if (Array.isArray(sc2) && sc2.length) {
        sessionCriteria = sc2;
      } else {
        // Legacy sessions: use all criteria names as fallback
        sessionCriteria = criteria
          .map(c => typeof c === 'string' ? c : (c.name || ''))
          .filter(Boolean);
      }
      const lastIdx = sts.findLastIndex(s => s.status === 'presenting' || s.status === 'prepping');
      // Restore incomplete student to pending so they can be re-done
      if (lastIdx >= 0 && (sts[lastIdx].status === 'presenting' || sts[lastIdx].status === 'prepping')) {
        sts[lastIdx].status = 'pending';
      }
      sessionStarted = sts.some(s => s.status !== 'pending');
      updateHeader();
      renderSidebar();
      renderCriteria(-1);
      updateTimerBar();
      updateActionBar();
      updateSaveBtn();
      updateResetBtn();
      showMarking();
      return true;
    } catch (e) {
      localStorage.removeItem(SESSION_STORAGE_KEY);
      return false;
    }
  }

  // ── Helpers ──────────────────────────────────────────────
  function fmtTime(secs) {
    if (secs == null || isNaN(secs)) return '—:——';
    const s = Math.floor(secs);
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return m + ':' + String(ss).padStart(2, '0');
  }

  function fmtGrade(g) {
    if (g == null) return '—';
    const n = Number(g);
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }

  function fmtStudentName(name, studentObj) {
    if (studentObj && window.StudentNameUtils && typeof StudentNameUtils.formatStudentDisplayName === 'function') {
      return StudentNameUtils.formatStudentDisplayName(studentObj, 'custom', 'firstLastInitial') || name || '—';
    }
    if (!name) return '—';
    // Schedule stores names in UPPERCASE — convert to Title Case
    return name.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  function normalizeStudentName(name) {
    return (name || '').toUpperCase().trim();
  }

  function parseJsVar(content, varName) {
    try {
      const win = {};
      const fn = new Function('window', content);
      fn(win);
      return win[varName] || null;
    } catch (e) { return null; }
  }

  function generateUuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function showNotice(msg, isError) {
    const el = document.getElementById('om-notice');
    el.textContent = msg;
    el.className   = 'om-notice' + (isError ? ' error' : ' success');
    el.classList.remove('hidden');
    clearTimeout(showNotice._t);
    if (!isError) showNotice._t = setTimeout(() => el.classList.add('hidden'), 4000);
  }

  function goBack() {
    if (phase === 'exam' && currentIdx >= 0) {
      if (!confirm(t('omConfirmCancelSession'))) return;
    }
    stopTimer();
    if (window.Desktop && typeof Desktop.openTool === 'function') {
      Desktop.openTool('launcher.html');
    } else {
      window.location.href = '../launcher.html';
    }
  }

  // ── Keyboard Shortcuts & Tutorial ──────────────────────
  function openOmShortcutsModal() {
    if (typeof ShortcutsModal === 'undefined') return;
    ShortcutsModal.open({
      title: t('skmTitle') || 'Keyboard Shortcuts',
      rows: [
        { section: t('omShortcutsSession') || 'Oral Marking Session' },
        { keys: ['Space'], desc: t('omShortcutSpaceDesc') || 'Pause / Resume timer' },
        { keys: ['P'], desc: t('omShortcutPDesc') || 'Toggle presenter view' },
        { keys: ['Ctrl', 'S'], alt: ['Cmd', 'S'], desc: t('omShortcutSaveDesc') || 'Save grades to Grade Sheet' },
        { keys: ['Esc'], desc: t('omShortcutEscDesc') || 'Exit presenter or close dialog' }
      ],
      noShortcutsText: t('skmNone')
    });
  }

  function initKeyboardShortcuts() {
    if (initKeyboardShortcuts._bound) return;
    initKeyboardShortcuts._bound = true;
    document.addEventListener('keydown', (e) => {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable) return;

      if (e.code === 'Space') {
        if (sessionStarted && phase !== 'idle' && phase !== 'done-all') {
          e.preventDefault();
          togglePause();
        }
      } else if (e.key === 'p' || e.key === 'P') {
        if (!e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          togglePresenter();
        }
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        saveGrades();
      } else if (e.key === 'Escape') {
        if (presenterOpen) {
          togglePresenter();
        }
      }
    });
  }

  function startOmTutorial() {
    if (typeof Tutorial === 'undefined') return;
    const steps = [
      { selector: '#app-nav', title: t('tutOm1Title'), text: t('tutOm1Text') },
      { selector: '#om-load-btn', title: t('tutOm2Title'), text: t('tutOm2Text') },
      { selector: '#om-setup-configured', title: t('tutOm3Title'), text: t('tutOm3Text') },
      { selector: '#om-sidebar', title: t('tutOm4Title'), text: t('tutOm4Text') },
      { selector: '#om-timer-bar', title: t('tutOm5Title'), text: t('tutOm5Text') },
      { selector: '#om-presenter-btn', title: t('tutOm6Title'), text: t('tutOm6Text') },
      { selector: '#om-save-gs-btn', title: t('tutOm7Title'), text: t('tutOm7Text') }
    ];
    Tutorial.start(steps, {
      next: t('tutNext') || 'Next',
      prev: t('tutPrev') || 'Prev',
      skip: t('tutSkip') || 'Skip',
      done: t('tutDone') || 'Done'
    });
  }

  // ── Public surface ───────────────────────────────────────
  window.goBack             = goBack;
  window.openScheduleModal  = openScheduleModal;
  window.closeScheduleModal = closeScheduleModal;
  window.handleActionBtn    = handleActionBtn;
  window.skipStudent        = skipStudent;
  window.togglePause        = togglePause;
  window.togglePresenter    = togglePresenter;
  window.saveGrades         = saveGrades;
  window.openInGradeSheet   = openInGradeSheet;
  window.saveTemplate       = saveTemplate;
  window.beginSession       = beginSession;
  window.confirmResetSession = confirmResetSession;
  window.resetSession        = resetSession;
  window.openOmShortcutsModal = openOmShortcutsModal;
  window.startOmTutorial       = startOmTutorial;

  // ── Panel resize ─────────────────────────────────────────
  function initResize() {
    const handle    = document.getElementById('om-resize-handle');
    const notesPane = document.getElementById('om-notes-panel');
    if (!handle || !notesPane) return;
    let dragging = false;
    let startX   = 0;
    let startW   = 0;
    handle.addEventListener('mousedown', e => {
      dragging = true;
      startX   = e.clientX;
      startW   = notesPane.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.cursor       = 'col-resize';
      document.body.style.userSelect   = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const newW = Math.max(120, Math.min(600, startW + e.clientX - startX));
      notesPane.style.width = newW + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';
    });
  }

  // ── Boot ─────────────────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
