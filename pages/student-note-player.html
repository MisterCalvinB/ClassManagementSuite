<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Note Input</title>
  <link rel="stylesheet" href="../modules/lexend/lexend.css">
  <link rel="stylesheet" href="../css/student-note-player.css">
</head>
<body>
  <div class="card">
    <h1>Student Note Input</h1>
    <div class="sub">Pick your class and name, write your message, and send it.</div>

    <div class="row">
      <div>
        <label for="class-picker">Class</label>
        <select id="class-picker"></select>
        <label for="half-picker" style="margin-top:6px;">Half</label>
        <select id="half-picker">
          <option value="">All students</option>
          <option value="1">First half</option>
          <option value="2">Second half</option>
        </select>
      </div>
      <div>
        <label for="name-picker">Name</label>
        <select id="name-picker"></select>
        <input id="name-input" type="text" placeholder="Your name" style="display:none;margin-top:0;">
      </div>
      <div>
        <label for="server-url">Server</label>
        <input id="server-url" type="text" placeholder="http://localhost:8787" />
      </div>
    </div>

    <div>
      <label for="message-input">Your note</label>
      <textarea id="message-input" maxlength="600" placeholder="Write your contribution here..."></textarea>
    </div>

    <div class="toolbar">
      <button id="connect-btn" type="button">Connect</button>
      <button id="send-btn" class="primary" type="button">Send</button>
      <button id="disconnect-btn" type="button">Disconnect</button>
    </div>

    <div id="status" class="status">Waiting for setup...</div>
    <div id="meta" class="meta"></div>
  </div>

  <script src="../user/class-groups.js"></script>
  <script>
    const classPicker = document.getElementById('class-picker');
    const namePicker  = document.getElementById('name-picker');
    const nameInput   = document.getElementById('name-input');
    const serverInput = document.getElementById('server-url');

    let _nameMode = 'select'; // 'select' | 'text'
    function _getStudentName() {
      return _nameMode === 'text' ? String(nameInput.value || '').trim() : String(namePicker.value || '').trim();
    }
    function _switchNameMode(mode, names) {
      _nameMode = mode;
      if (mode === 'text') {
        namePicker.style.display = 'none';
        nameInput.style.display = '';
        nameInput.disabled = false;
      } else {
        nameInput.style.display = 'none';
        namePicker.style.display = '';
        namePicker.innerHTML = '';
        (names || []).forEach(function (n) {
          const o = document.createElement('option'); o.value = n; o.textContent = n; namePicker.appendChild(o);
        });
      }
    }
    const messageInput = document.getElementById('message-input');
    const connectBtn = document.getElementById('connect-btn');
    const sendBtn = document.getElementById('send-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');

    const query = new URLSearchParams(location.search);
    const noteId = String(query.get('note') || '').trim();
    const classFromUrl = String(query.get('class') || '').trim();
    const halfFromUrl = String(query.get('half') || '').trim();

    let ws = null;
    let connected = false;

    function setStatus(text, tone) {
      statusEl.textContent = String(text || '');
      statusEl.className = 'status';
      if (tone === 'ok') statusEl.classList.add('ok');
      if (tone === 'bad') statusEl.classList.add('bad');
    }

    function setButtons() {
      connectBtn.disabled = connected;
      disconnectBtn.disabled = !connected;
      sendBtn.disabled = !connected;
      classPicker.disabled = connected;
      const halfPicker = document.getElementById('half-picker');
      if (halfPicker) halfPicker.disabled = connected || (halfFromUrl === '1' || halfFromUrl === '2');
      namePicker.disabled = false;
      nameInput.disabled = false;
      serverInput.disabled = connected;
    }

    function wsUrlFromServerInput() {
      let base = String(serverInput.value || '').trim();
      if (!base) base = location.origin;
      if (!/^https?:\/\//i.test(base) && !/^wss?:\/\//i.test(base)) {
        base = 'http://' + base;
      }
      if (/^wss?:\/\//i.test(base)) {
        const clean = base.replace(/\/+$/, '');
        return /\/note-ws$/i.test(clean) ? clean : (clean + '/note-ws');
      }
      const u = new URL(base);
      const proto = u.protocol === 'https:' ? 'wss:' : 'ws:';
      return proto + '//' + u.host + '/note-ws';
    }

    function getSelectedClassInfo() {
      const classId = String(classPicker.value || '').trim();
      const classLabel = classId ? _snpGroupName(classId) : '';
      return { classId, classLabel };
    }

    function buildMeta() {
      const { classLabel } = getSelectedClassInfo();
      const studentName = String(namePicker.value || '');
      const roomText = noteId ? noteId : '(missing room id)';
      metaEl.innerHTML = '<strong>Room:</strong> ' + roomText + ' | <strong>Class:</strong> ' + (classLabel || '-') + ' | <strong>Name:</strong> ' + (studentName || '-');
    }

    function normalizeClassGroups() {
      const cgd = (typeof CLASS_GROUPS_DATA !== 'undefined' && CLASS_GROUPS_DATA) ? CLASS_GROUPS_DATA : null;
      const meta = (cgd && cgd.classGroupsMeta) || (typeof CLASS_GROUPS_META !== 'undefined' ? CLASS_GROUPS_META : {});
      const srcLegacy = (cgd && cgd.classGroups) || (typeof CLASS_GROUPS !== 'undefined' ? CLASS_GROUPS : null);
      const roster = (typeof STUDENTS_ROSTER !== 'undefined' && Array.isArray(STUDENTS_ROSTER))
        ? Object.fromEntries(STUDENTS_ROSTER.filter(s => s && s.uuid).map(s => [s.uuid, s]))
        : {};
      const groupUuids = Object.keys(meta).length ? Object.keys(meta) : (srcLegacy ? Object.keys(srcLegacy) : []);
      const out = {};
      groupUuids.forEach(function (key) {
        if (meta[key] && meta[key].archived) return;
        const students = (meta[key] && Array.isArray(meta[key].students) && meta[key].students.length)
          ? meta[key].students
          : (srcLegacy && Array.isArray(srcLegacy[key]) ? srcLegacy[key] : []);
        if (students.length > 0 && typeof students[0] === 'string' && students[0].startsWith('st-')) {
          out[key] = students.map(function (sid) {
            const s = roster[sid];
            return s ? ((s.firstName || '') + ' ' + (s.lastName || '')).trim().toUpperCase() : null;
          }).filter(Boolean);
        } else {
          out[key] = students.map(function (v) { return String(v || '').trim(); }).filter(Boolean);
        }
      });
      return out;
    }

    function refillNames() {
      const groups = normalizeClassGroups();
      const className = String(classPicker.value || '');
      let names = Array.isArray(groups[className]) ? groups[className] : [];

      const halfPicker = document.getElementById('half-picker');
      const half = halfPicker ? String(halfPicker.value || '') : '';
      if (half === '1') names = names.slice(0, Math.ceil(names.length / 2));
      else if (half === '2') names = names.slice(Math.ceil(names.length / 2));

      if (!names.length) {
        _switchNameMode('text');
      } else {
        _switchNameMode('select', names);
      }
      buildMeta();
    }

    function _snpGroupName(key) {
      try {
        const m = (typeof CLASS_GROUPS_DATA !== 'undefined' && CLASS_GROUPS_DATA && CLASS_GROUPS_DATA.classGroupsMeta)
          ? CLASS_GROUPS_DATA.classGroupsMeta[key]
          : ((typeof CLASS_GROUPS_META !== 'undefined' && CLASS_GROUPS_META) ? CLASS_GROUPS_META[key] : null);
        return (m && m.name) ? m.name : key;
      } catch { return key; }
    }

    function fillClasses() {
      const groups = normalizeClassGroups();
      const keys = Object.keys(groups).sort(function (a, b) { return _snpGroupName(a).localeCompare(_snpGroupName(b)); });
      const classFromUrlValue = String(classFromUrl || '').trim();
      const matchingKey = classFromUrlValue ? keys.find(function (key) {
        return key === classFromUrlValue || _snpGroupName(key) === classFromUrlValue;
      }) : null;
      // If classFromUrl is set but not in loaded data (e.g. remote server without local file),
      // still allow it so the student can proceed with a text name input.
      const visibleKeys = matchingKey ? [matchingKey] : (classFromUrlValue ? [classFromUrlValue] : keys);
      classPicker.innerHTML = '';
      if (!visibleKeys.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No classes found';
        classPicker.appendChild(opt);
        refillNames();
        return;
      }
      visibleKeys.forEach(function (key) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = _snpGroupName(key);
        classPicker.appendChild(opt);
      });
      if (matchingKey) {
        classPicker.value = matchingKey;
      } else if (classFromUrlValue && visibleKeys.includes(classFromUrlValue)) {
        classPicker.value = classFromUrlValue;
      }
      classPicker.disabled = !!classFromUrl;
      refillNames();
    }

    function disconnect() {
      if (ws) {
        try { ws.close(); } catch (_) {}
      }
      ws = null;
      connected = false;
      setButtons();
      setStatus('Disconnected.', 'bad');
    }

    function connect(isAuto) {
      isAuto = (isAuto === true);
      if (!noteId) {
        if (!isAuto) setStatus('Missing room id in URL. Ask your teacher for a new QR/link.', 'bad');
        return;
      }
      const { classId, classLabel } = getSelectedClassInfo();
      let studentName = _getStudentName();
      if (!classId && !isAuto) {
        setStatus('Select your class first.', 'bad');
        return;
      }
      if (!studentName) {
        if (isAuto) {
          studentName = 'Student';
        } else {
          setStatus('Enter your name first.', 'bad');
          return;
        }
      }

      disconnect();
      let url = '';
      try {
        url = wsUrlFromServerInput();
      } catch (_) {
        if (!isAuto) setStatus('Invalid server URL.', 'bad');
        return;
      }

      setStatus('Connecting...', '');
      try {
        ws = new WebSocket(url);
      } catch (_) {
        setStatus('Could not open websocket.', 'bad');
        return;
      }

      ws.onopen = function () {
        connected = true;
        setButtons();
        ws.send(JSON.stringify({
          type: 'hello',
          role: 'note-student',
          noteId: noteId,
          classGroup: classLabel || classId || '',
          name: studentName
        }));
      };

      ws.onmessage = function (event) {
        let msg = null;
        try { msg = JSON.parse(event.data); } catch (_) { return; }
        if (!msg || !msg.type) return;

        if (msg.type === 'welcome') {
          // If the server sends classGroup, update the classPicker
          if (msg.classGroup) {
            let found = false;
            for (let i = 0; i < classPicker.options.length; i++) {
              if (classPicker.options[i].value === msg.classGroup) {
                classPicker.value = msg.classGroup;
                found = true;
                break;
              }
            }
            if (!found) {
              const opt = document.createElement('option');
              opt.value = msg.classGroup;
              opt.textContent = msg.classGroup;
              if (classPicker.options.length === 1 && classPicker.options[0].value === '') {
                classPicker.innerHTML = '';
              }
              classPicker.appendChild(opt);
              classPicker.value = msg.classGroup;
            }
          }

          // If the server sends a roster, switch to the dropdown now
          if (Array.isArray(msg.roster) && msg.roster.length) {
            const currentSelected = _getStudentName();
            _switchNameMode('select', msg.roster);
            // If the user already had a name selected or typed (and it wasn't the placeholder 'Student'), try to preserve it!
            if (currentSelected && currentSelected !== 'Student') {
              const matched = msg.roster.find(n => n.toUpperCase() === currentSelected.toUpperCase()) ||
                              msg.roster.find(n => n.toUpperCase().includes(currentSelected.toUpperCase()));
              if (matched) {
                namePicker.value = matched;
                // If it matched but the text representation was slightly different, update the server
                if (matched !== currentSelected && ws && connected) {
                  ws.send(JSON.stringify({
                    type: 'hello',
                    role: 'note-student',
                    noteId: noteId,
                    classGroup: getSelectedClassInfo().classLabel || getSelectedClassInfo().classId || '',
                    name: matched
                  }));
                }
              }
            }
          }
          setStatus('Connected. You can now send your note.', 'ok');
          buildMeta();
        } else if (msg.type === 'note_ack') {
          messageInput.value = '';
          setStatus('Sent to teacher.', 'ok');
        } else if (msg.type === 'status') {
          const text = String((msg.payload && msg.payload.message) || 'Status update');
          setStatus(text, '');
        } else if (msg.type === 'error') {
          setStatus(String(msg.message || 'Server error'), 'bad');
        }
      };

      ws.onclose = function () {
        connected = false;
        setButtons();
        setStatus('Connection closed.', 'bad');
      };

      ws.onerror = function () {
        setStatus('Websocket error.', 'bad');
      };
    }

    function sendNote() {
      if (!connected || !ws) {
        setStatus('Connect first.', 'bad');
        return;
      }
      const text = String(messageInput.value || '').replace(/\s+/g, ' ').trim();
      if (!text) {
        setStatus('Write something first.', 'bad');
        return;
      }
      ws.send(JSON.stringify({
        type: 'note_submit',
        payload: { text: text }
      }));
    }

    classPicker.addEventListener('change', function () {
      refillNames();
      buildMeta();
    });
    const _halfPickerEl = document.getElementById('half-picker');
    if (_halfPickerEl) {
      _halfPickerEl.addEventListener('change', function () {
        refillNames();
        buildMeta();
      });
    }

    function sendNameUpdate() {
      buildMeta();
      if (connected && ws) {
        ws.send(JSON.stringify({
          type: 'hello',
          role: 'note-student',
          noteId: noteId,
          classGroup: getSelectedClassInfo().classLabel || getSelectedClassInfo().classId || '',
          name: _getStudentName()
        }));
      }
    }
    namePicker.addEventListener('change', sendNameUpdate);
    nameInput.addEventListener('change', sendNameUpdate);

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    sendBtn.addEventListener('click', sendNote);
    messageInput.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        sendNote();
      }
    });

    const isLocalFile = !location.origin || /^file:/i.test(location.origin) || location.origin === 'null';
    serverInput.value = isLocalFile ? 'http://localhost:8787' : location.origin;
    if (_halfPickerEl && (halfFromUrl === '1' || halfFromUrl === '2')) {
      _halfPickerEl.value = halfFromUrl;
    }
    fillClasses();
    buildMeta();
    setButtons();

    if (!noteId) {
      setStatus('Missing room id. Open this page from your teacher QR/link.', 'bad');
    } else {
      setStatus('Connecting automatically...', '');
      connect(true);
    }
  </script>
</body>
</html>
