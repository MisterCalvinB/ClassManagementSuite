<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Player</title>
  <link rel="stylesheet" href="../modules/lexend/lexend.css">
  <link rel="stylesheet" href="../css/quiz-player.css">
</head>
<body>
  <div class="card">
    <h1>Multiplayer Quiz Player</h1>
    <div id="status" class="status">Enter your name and connect.</div>

    <div class="row">
      <div class="field">
        <label for="class-picker">Class</label>
        <select id="class-picker"></select>
      </div>
      <div class="field">
        <label for="half-picker">Half</label>
        <select id="half-picker">
          <option value="">All students</option>
          <option value="1">First half</option>
          <option value="2">Second half</option>
        </select>
      </div>
      <div class="field">
        <label for="student-picker">Student</label>
        <select id="student-picker"></select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="name">Name (editable)</label>
        <input id="name" type="text" maxlength="24" placeholder="Your name" />
      </div>
      <button id="connect" class="primary" type="button">Connect</button>
      <button id="disconnect" type="button">Disconnect</button>
    </div>

    <div id="question">Waiting for host...</div>
    <div id="answers" class="answers"></div>

    <div class="meta" id="result"></div>
    <div id="leaderboard"></div>
  </div>

  <script src="../user/class-groups.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const classPickerEl = document.getElementById('class-picker');
    const halfPickerEl = document.getElementById('half-picker');
    const studentPickerEl = document.getElementById('student-picker');
    const nameEl = document.getElementById('name');
    const connectBtn = document.getElementById('connect');
    const disconnectBtn = document.getElementById('disconnect');
    const questionEl = document.getElementById('question');
    const answersEl = document.getElementById('answers');
    const resultEl = document.getElementById('result');
    const leaderboardEl = document.getElementById('leaderboard');

    let ws = null;
    let connected = false;
    let playerId = '';
    let questionState = null;
    let selectedAnswer = null;
    let questionStartedAt = 0;
    let remoteClassGroupsState = null;

    const _qpQuery = new URLSearchParams(location.search);
    const classFromUrl = String(_qpQuery.get('class') || '').trim();
    const halfFromUrl = String(_qpQuery.get('half') || '').trim();
    const nameFromUrl = String(_qpQuery.get('name') || _qpQuery.get('student') || '').trim();

    function _qpGetGroupLabel(groupId) {
      try {
        const meta = (typeof CLASS_GROUPS_META !== 'undefined' && CLASS_GROUPS_META) ? CLASS_GROUPS_META : {};
        return (meta[groupId] && meta[groupId].name) ? String(meta[groupId].name) : String(groupId);
      } catch { return String(groupId); }
    }

    function normalizeClassGroups() {
      const payload = remoteClassGroupsState && remoteClassGroupsState.classGroupsData ? remoteClassGroupsState.classGroupsData : null;
      const cgd = payload || ((typeof CLASS_GROUPS_DATA !== 'undefined' && CLASS_GROUPS_DATA) ? CLASS_GROUPS_DATA : null);
      const meta = (cgd && cgd.classGroupsMeta) || (typeof CLASS_GROUPS_META !== 'undefined' ? CLASS_GROUPS_META : {});
      const srcLegacy = (cgd && cgd.classGroups) || (typeof CLASS_GROUPS !== 'undefined' ? CLASS_GROUPS : null);
      const roster = (typeof STUDENTS_ROSTER !== 'undefined' && Array.isArray(STUDENTS_ROSTER))
        ? Object.fromEntries(STUDENTS_ROSTER.filter(s => s && s.uuid).map(s => [s.uuid, s]))
        : {};
      const groupUuids = Object.keys(meta).length ? Object.keys(meta) : (srcLegacy ? Object.keys(srcLegacy) : []);
      const groups = {};
      const labels = {};
      groupUuids.forEach(function (key) {
        if (meta[key] && meta[key].archived) return;
        labels[String(key)] = (meta[key] && meta[key].name) ? meta[key].name : String(key);
        const students = (meta[key] && Array.isArray(meta[key].students) && meta[key].students.length)
          ? meta[key].students
          : (srcLegacy && Array.isArray(srcLegacy[key]) ? srcLegacy[key] : []);
        if (students.length > 0 && typeof students[0] === 'string' && students[0].startsWith('st-')) {
          groups[String(key)] = students.map(function (sid) {
            const s = roster[sid];
            return s ? ((s.firstName || '') + ' ' + (s.lastName || '')).trim().toUpperCase() : null;
          }).filter(Boolean);
        } else {
          groups[String(key)] = students.map(function (v) { return String(v || '').trim(); }).filter(Boolean);
        }
      });
      return { groups, labels };
    }

    function getStoredClassGroup() {
      try {
        return String(localStorage.getItem('active_class_group') || '').trim();
      } catch (_) {
        return '';
      }
    }

    function injectClassicScript(source, name) {
      const script = document.createElement('script');
      script.text = String(source || '') + '\n//# sourceURL=' + name;
      document.head.appendChild(script);
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    function loadScriptBySrc(src) {
      return new Promise(function (resolve) {
        const script = document.createElement('script');
        script.src = src;
        script.onload = function () { resolve(true); };
        script.onerror = function () { resolve(false); };
        document.head.appendChild(script);
      });
    }

    async function loadClassGroupsData() {
      if (typeof CLASS_GROUPS_DATA !== 'undefined' || typeof CLASS_GROUPS_META !== 'undefined') {
        return true;
      }

      if (window.Desktop && typeof Desktop.isElectron === 'function' && Desktop.isElectron() && typeof Desktop.readText === 'function') {
        try {
          const result = await Desktop.readText('user', 'class-groups.js');
          if (result && result.ok && result.content) {
            injectClassicScript(result.content, 'user/class-groups.js');
            return true;
          }
        } catch (_) {}
      }

      const candidates = [
        '../user/class-groups.js',
        './user/class-groups.js',
        '/user/class-groups.js',
        'user/class-groups.js'
      ];

      for (let i = 0; i < candidates.length; i++) {
        const ok = await loadScriptBySrc(candidates[i]);
        if (ok) return true;
      }
      return false;
    }

    function sendNameUpdate() {
      const name = String(nameEl.value || '').trim();
      if (connected && ws && name) {
        ws.send(JSON.stringify({ type: 'hello', role: 'player', name }));
      }
    }

    function fillStudentPicker() {
      const { groups } = normalizeClassGroups();
      const className = String(classPickerEl.value || '');
      let names = Array.isArray(groups[className]) ? groups[className] : [];

      const half = halfPickerEl ? String(halfPickerEl.value || '') : '';
      if (half === '1') names = names.slice(0, Math.ceil(names.length / 2));
      else if (half === '2') names = names.slice(Math.ceil(names.length / 2));

      studentPickerEl.innerHTML = '';

      if (!names.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Type name below';
        studentPickerEl.appendChild(opt);
        return;
      }

      names.forEach(function (name, idx) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        studentPickerEl.appendChild(opt);
        if (idx === 0) opt.selected = true;
      });

      const oldVal = nameEl.value;
      if (!String(nameEl.value || '').trim()) {
        nameEl.value = String(studentPickerEl.value || '');
      }
      if (nameEl.value !== oldVal) {
        sendNameUpdate();
      }
    }

    function fillClassPicker() {
      const { groups, labels } = normalizeClassGroups();
      const storedClassGroup = getStoredClassGroup();
      const classFromUrlValue = String(classFromUrl || '').trim();
      
      let classNames = Object.keys(groups).sort(function (a, b) {
        return (labels[a] || a).localeCompare(labels[b] || b);
      });

      let matchingKey = null;
      if (classFromUrlValue) {
        if (classNames.includes(classFromUrlValue)) {
          matchingKey = classFromUrlValue;
        } else {
          matchingKey = classNames.find(function (key) {
            return _qpGetGroupLabel(key) === classFromUrlValue;
          });
        }
      }

      if (!matchingKey && storedClassGroup && classNames.includes(storedClassGroup)) {
        matchingKey = storedClassGroup;
      }

      classPickerEl.innerHTML = '';

      if (!classNames.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No class list loaded';
        classPickerEl.appendChild(opt);
        fillStudentPicker();
        return;
      }

      classNames.forEach(function (className) {
        const opt = document.createElement('option');
        opt.value = className;
        opt.textContent = labels[className] || className;
        classPickerEl.appendChild(opt);
      });

      if (matchingKey) {
        classPickerEl.value = matchingKey;
      } else if (classNames.length) {
        classPickerEl.value = classNames[0];
      }

      fillStudentPicker();
    }

    function wsUrl() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = (!location.host || location.origin === 'null') ? 'localhost:8787' : location.host;
      return proto + '//' + host + '/quiz-ws';
    }

    function setStatus(text, isError) {
      statusEl.textContent = String(text || '');
      statusEl.style.color = isError ? '#b91c1c' : '#475569';
    }

    function setButtons() {
      connectBtn.disabled = connected;
      disconnectBtn.disabled = !connected;
      nameEl.disabled = false;
      classPickerEl.disabled = false;
      halfPickerEl.disabled = (halfFromUrl === '1' || halfFromUrl === '2');
      studentPickerEl.disabled = false;
    }

    function formatMs(ms) {
      const n = Number(ms);
      if (!isFinite(n) || n < 0) return '--';
      if (n < 10000) return (n / 1000).toFixed(2) + 's';
      return (n / 1000).toFixed(1) + 's';
    }

    function renderQuestion() {
      answersEl.innerHTML = '';
      if (!questionState) {
        questionEl.textContent = 'Waiting for host...';
        return;
      }
      questionEl.textContent = questionState.question || 'Question';
      (questionState.answers || []).forEach((answerText, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = String(answerText || '');
        btn.classList.add('answer-color-' + String(idx % 4));
        btn.disabled = selectedAnswer !== null;
        btn.onclick = function() { submitAnswer(idx); };
        answersEl.appendChild(btn);
      });
    }

    function renderLeaderboard(rows) {
      const items = Array.isArray(rows) ? rows : [];
      if (!items.length) {
        leaderboardEl.textContent = '';
        return;
      }
      leaderboardEl.innerHTML = '<strong>Leaderboard</strong>';
      items.slice(0, 10).forEach((item, idx) => {
        const line = document.createElement('div');
        line.className = 'line';
        const score = Number(item.score || 0);
        const hasRound = Number.isFinite(Number(item.scoreDelta)) || Number.isFinite(Number(item.elapsedMs)) || Number.isFinite(Number(item.speedRank));
        if (hasRound) {
          const delta = Number(item.scoreDelta || 0);
          const deltaText = (delta > 0 ? '+' : '') + delta;
          const t = formatMs(item.elapsedMs);
          const rankText = item.speedRank ? ('#' + Number(item.speedRank)) : '--';
          line.textContent = (idx + 1) + '. ' + String(item.name || 'Player') + ' - ' + score + ' (' + deltaText + ' pts, ' + t + ', speed ' + rankText + ')';
        } else {
          line.textContent = (idx + 1) + '. ' + String(item.name || 'Player') + ' - ' + score;
        }
        leaderboardEl.appendChild(line);
      });
    }

    function submitAnswer(answerIndex) {
      if (!connected || !ws || !questionState || selectedAnswer !== null) return;
      selectedAnswer = Number(answerIndex);
      ws.send(JSON.stringify({
        type: 'player_answer',
        payload: {
          questionId: Number(questionState.id),
          answerIndex: Number(answerIndex)
        }
      }));
      resultEl.textContent = 'Answer submitted.';
      Array.from(answersEl.querySelectorAll('button')).forEach(btn => btn.disabled = true);
    }

    function disconnect() {
      if (ws) {
        try { ws.close(); } catch (_) {}
      }
      ws = null;
      connected = false;
      playerId = '';
      questionState = null;
      selectedAnswer = null;
      questionStartedAt = 0;
      resultEl.textContent = '';
      renderQuestion();
      setButtons();
      setStatus('Disconnected.', true);
    }

    function connect(isAuto) {
      isAuto = (isAuto === true);
      const pickedStudent = String(studentPickerEl.value || '').trim();
      const typedName = String(nameEl.value || '').trim();
      let name = typedName || pickedStudent;
      if (!name) {
        if (isAuto) {
          name = 'Player';
        } else {
          setStatus('Enter your name first.', true);
          return;
        }
      }
      nameEl.value = name;
      disconnect();
      setStatus('Connecting...', false);
      try {
        ws = new WebSocket(wsUrl());
      } catch (_) {
        setStatus('Could not open websocket.', true);
        return;
      }

      ws.onopen = function() {
        connected = true;
        setButtons();
        ws.send(JSON.stringify({ type: 'hello', role: 'player', name, playerId: playerId || null }));
      };

      ws.onmessage = function(event) {
        let msg = null;
        try { msg = JSON.parse(event.data); } catch (_) { return; }

        if (msg.type === 'welcome') {
          if (msg.role === 'player' && msg.playerId) {
            playerId = String(msg.playerId);
          }
          const displayName = msg.name || name;
          setStatus('Connected as ' + displayName + '.', false);
        } else if (msg.type === 'question') {
          questionState = msg.payload || null;
          selectedAnswer = null;
          questionStartedAt = Date.now();
          resultEl.textContent = '';
          renderQuestion();
          setStatus('Question is live. Choose one answer.', false);
        } else if (msg.type === 'answer_ack') {
          setStatus('Answer recorded.', false);
        } else if (msg.type === 'reveal') {
          const payload = msg.payload || {};
          const correct = Number(payload.correctIndex);
          const buttons = Array.from(answersEl.querySelectorAll('button'));
          buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correct) btn.classList.add('ok');
            if (selectedAnswer !== null && idx === selectedAnswer && idx !== correct) btn.classList.add('bad');
            if (idx !== correct && !(selectedAnswer !== null && idx === selectedAnswer)) {
              btn.style.filter = 'brightness(0.76)';
            }
          });
          if (selectedAnswer === null) {
            resultEl.textContent = 'Time up. Correct answer: ' + String(payload.correctAnswer || '');
          } else if (selectedAnswer === correct) {
            resultEl.textContent = 'Correct!';
          } else {
            resultEl.textContent = 'Wrong. Correct answer: ' + String(payload.correctAnswer || '');
          }
          const myRow = Array.isArray(payload.leaderboard)
            ? payload.leaderboard.find(row => String(row.id || '') === playerId)
            : null;
          if (myRow) {
            const myDelta = Number(myRow.scoreDelta || 0);
            const myTime = formatMs(myRow.elapsedMs);
            const myRank = myRow.speedRank ? ('#' + Number(myRow.speedRank)) : '--';
            resultEl.textContent += ' | +' + myDelta + ' pts | Time: ' + myTime + ' | Speed: ' + myRank;
          } else if (questionStartedAt > 0 && selectedAnswer !== null) {
            const localMs = Math.max(0, Date.now() - questionStartedAt);
            resultEl.textContent += ' | Time: ' + formatMs(localMs);
          }
          renderLeaderboard(payload.leaderboard || []);
          setStatus('Answer revealed.', false);
        } else if (msg.type === 'final_results') {
          const payload = msg.payload || {};
          questionState = null;
          selectedAnswer = null;
          questionEl.textContent = '🏁 Game finished';
          answersEl.innerHTML = '';
          renderLeaderboard(payload.leaderboard || []);
          const winner = payload.winner && payload.winner.name
            ? (String(payload.winner.name) + ' (' + Number(payload.winner.score || 0) + ')')
            : 'No winner';
          resultEl.textContent = 'Final results posted. Winner: ' + winner;
          setStatus('Game ended by host. See final leaderboard.', false);
        } else if (msg.type === 'class_groups') {
          remoteClassGroupsState = msg.payload || null;
          const currentSelected = String(nameEl.value || '').trim();
          fillClassPicker();
          if (currentSelected && currentSelected !== 'Player') {
            const { groups } = normalizeClassGroups();
            const className = String(classPickerEl.value || '');
            const names = Array.isArray(groups[className]) ? groups[className] : [];
            const matched = names.find(n => n.toUpperCase() === currentSelected.toUpperCase()) ||
                            names.find(n => n.toUpperCase().includes(currentSelected.toUpperCase()));
            if (matched) {
              studentPickerEl.value = matched;
              nameEl.value = matched;
              sendNameUpdate();
            }
          }
          setStatus('Class list updated from host.', false);
        } else if (msg.type === 'presence') {
          renderLeaderboard(msg.leaderboard || []);
        } else if (msg.type === 'status') {
          const text = String(msg.payload && msg.payload.message || 'Server status update');
          setStatus(text, false);
        } else if (msg.type === 'error') {
          setStatus(String(msg.message || 'Server error'), true);
        }
      };

      ws.onerror = function() {
        setStatus('Websocket error.', true);
      };

      ws.onclose = function() {
        connected = false;
        setButtons();
        setStatus('Connection closed.', true);
      };
    }

    connectBtn.addEventListener('click', () => connect(false));
    disconnectBtn.addEventListener('click', disconnect);
    classPickerEl.addEventListener('change', function() {
      fillStudentPicker();
    });
    halfPickerEl.addEventListener('change', function() {
      fillStudentPicker();
    });
    
    studentPickerEl.addEventListener('change', function() {
      const selected = String(studentPickerEl.value || '').trim();
      if (selected) {
        nameEl.value = selected;
        sendNameUpdate();
      }
    });
    nameEl.addEventListener('change', sendNameUpdate);
    nameEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') connect();
    });
    
    if (nameFromUrl) {
      nameEl.value = nameFromUrl;
    }
    if (halfFromUrl === '1' || halfFromUrl === '2') {
      halfPickerEl.value = halfFromUrl;
    }

    loadClassGroupsData().then(function () {
      fillClassPicker();
      setButtons();
      
      setStatus('Connecting automatically...', false);
      connect(true);
    });
  </script>
</body>
</html>
